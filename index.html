
<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#090914">

<style>
:root {
  --bg:#08080f;
  --surface:rgba(22,22,38,.76);
  --card:rgba(25,25,43,.68);
  --text:#f8f7ff;
  --muted:#a09db3;
  --border:rgba(255,255,255,.11);
  --accent:#a78bfa;
  --blue:#3897ff;
  --shadow:0 18px 55px rgba(0,0,0,.27);
}

body.light {
  --bg:#f3f2fa;
  --surface:rgba(255,255,255,.92);
  --card:rgba(255,255,255,.88);
  --text:#191629;
  --muted:#77738b;
  --border:rgba(40,30,80,.12);
  --accent:#7952d8;
  --blue:#1677e8;
  --shadow:0 15px 40px rgba(50,40,90,.09);
}

* {box-sizing:border-box}

html {scroll-behavior:smooth}

body {
  margin:0;
  min-height:100vh;
  overflow-x:hidden;
  font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;
  background:
    radial-gradient(ellipse at 10% 5%,rgba(124,58,237,.18),transparent 38%),
    radial-gradient(ellipse at 95% 45%,rgba(37,99,235,.13),transparent 38%),
    var(--bg);
  color:var(--text);
  transition:background .3s,color .3s;
}

button {font:inherit}

body::before,
body::after {
  content:"";
  position:fixed;
  width:300px;
  height:300px;
  border-radius:50%;
  filter:blur(100px);
  pointer-events:none;
  z-index:-1;
  opacity:.35;
  animation:ambient 14s ease-in-out infinite alternate;
}

body::before {
  background:#7138db;
  top:10%;
  left:-200px;
}

body::after {
  background:#176bd8;
  bottom:5%;
  right:-220px;
  animation-delay:3s;
}

@keyframes ambient {
  from {transform:translate(0,0)}
  to {transform:translate(100px,70px)}
}

/* LOADER */

#loader {
  position:fixed;
  inset:0;
  z-index:99999;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  gap:18px;
  background:#090914;
  color:white;
  transition:opacity .5s,visibility .5s;
}

#loader.hide {
  opacity:0;
  visibility:hidden;
  pointer-events:none;
}

.loader-logo {
  font-size:35px;
  font-weight:950;
  letter-spacing:4px;
  background:linear-gradient(120deg,#b69aff,#55aaff);
  background-clip:text;
  -webkit-background-clip:text;
  color:transparent;
  animation:pulse 1.2s ease-in-out infinite alternate;
}

.loader-line {
  width:100px;
  height:3px;
  border-radius:10px;
  background:linear-gradient(90deg,#9b6cff,#55aaff);
  animation:line 1s ease-in-out infinite alternate;
}

@keyframes pulse {
  to {opacity:.55;transform:scale(.96)}
}

@keyframes line {
  from {transform:scaleX(.3)}
  to {transform:scaleX(1)}
}

/* LAYOUT */

.container {
  width:min(100% - 32px,760px);
  margin:auto;
  padding:22px 0 30px;
}

/* NAVIGATION */

nav {
  position:relative;
  z-index:1000;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:10px;
  padding:13px 15px;
  border:1px solid var(--border);
  border-radius:19px;
  background:var(--surface);
  backdrop-filter:blur(20px);
  -webkit-backdrop-filter:blur(20px);
  box-shadow:var(--shadow);
  animation:fadeDown .7s ease both;
}

.brand {
  font-size:15px;
  font-weight:950;
  letter-spacing:1.5px;
}

.controls {
  position:relative;
  z-index:1001;
  display:flex;
  align-items:center;
  gap:7px;
}

.dropdown {
  position:relative;
  z-index:1002;
}

.control {
  display:flex;
  align-items:center;
  gap:7px;
  border:1px solid var(--border);
  background:var(--card);
  color:var(--text);
  padding:9px 11px;
  border-radius:11px;
  cursor:pointer;
  font-size:11px;
  font-weight:800;
  transition:.25s;
  white-space:nowrap;
}

.control:hover,
.control[aria-expanded="true"] {
  border-color:var(--accent);
}

.dropdown-menu {
  position:absolute;
  top:calc(100% + 9px);
  inset-inline-end:0;
  z-index:9999;
  width:155px;
  max-height:260px;
  overflow-y:auto;
  padding:7px;
  border:1px solid var(--border);
  border-radius:15px;
  background:var(--surface);
  backdrop-filter:blur(25px);
  -webkit-backdrop-filter:blur(25px);
  box-shadow:var(--shadow);
  display:none;
  animation:fadeUp .2s ease both;
  isolation:isolate;
}

.dropdown-menu.open {
  display:block;
}

.menu-option {
  display:flex;
  align-items:center;
  justify-content:space-between;
  width:100%;
  min-height:40px;
  padding:11px 10px;
  border:0;
  border-radius:9px;
  background:transparent;
  color:var(--text);
  text-align:start;
  cursor:pointer;
  font-size:12px;
  font-weight:700;
  transition:.2s;
  -webkit-tap-highlight-color:transparent;
}

.menu-option:hover,
.menu-option:focus-visible {
  background:rgba(167,139,250,.16);
  outline:none;
}

.menu-option.active {
  color:var(--accent);
  background:rgba(167,139,250,.10);
}

.option-check {
  color:var(--blue);
  font-weight:900;
}

/* PROFILE */

header {
  text-align:center;
  padding:48px 12px 28px;
  animation:fadeUp .8s ease .1s both;
}

.avatar {
  width:116px;
  height:116px;
  margin:0 auto 20px;
  padding:3px;
  border-radius:35px;
  background:linear-gradient(135deg,#a78bfa,#42a5ff);
  box-shadow:0 12px 40px rgba(124,58,237,.3);
  animation:avatarGlow 4s ease-in-out infinite;
}

.avatar img {
  width:100%;
  height:100%;
  object-fit:cover;
  border-radius:32px;
  background:var(--surface);
}

@keyframes avatarGlow {
  0%,100% {box-shadow:0 10px 28px rgba(124,58,237,.2)}
  50% {box-shadow:0 12px 48px rgba(66,165,255,.38)}
}

/* NAME */

.name-line {
  display:flex;
  justify-content:center;
  align-items:center;
  gap:7px;
  margin:0;
}

.name-line h1 {
  margin:0;
  font-size:clamp(23px,5vw,29px);
  font-weight:950;
  letter-spacing:1.4px;
}

.verified {
  width:20px;
  height:20px;
  display:inline-grid;
  place-items:center;
  flex-shrink:0;
  color:white;
  background:#278cff;
  border-radius:50%;
  font-size:13px;
  font-weight:950;
  box-shadow:0 0 14px rgba(39,140,255,.35);
}

.subtitle {
  color:var(--accent);
  font-size:13px;
  margin:12px 0;
  font-weight:750;
}

.bio {
  max-width:430px;
  margin:0 auto;
  color:var(--muted);
  line-height:1.8;
  font-size:14px;
}

.tags {
  display:flex;
  justify-content:center;
  flex-wrap:wrap;
  gap:9px;
  margin-top:20px;
}

.tag {
  padding:8px 13px;
  border:1px solid var(--border);
  border-radius:30px;
  background:var(--surface);
  backdrop-filter:blur(12px);
  font-size:10px;
  font-weight:800;
}

/* CLOCK */

.clock-box {
  width:max-content;
  max-width:100%;
  margin:20px auto 0;
  padding:10px 17px;
  border:1px solid var(--border);
  border-radius:14px;
  background:var(--surface);
  backdrop-filter:blur(15px);
  text-align:center;
}

.clock-time {
  font-size:18px;
  font-weight:900;
  letter-spacing:1px;
}

.clock-date {
  margin-top:3px;
  color:var(--muted);
  font-size:10px;
}

/* ACTIONS */

.actions {
  display:flex;
  justify-content:center;
  flex-wrap:wrap;
  gap:9px;
  margin:24px auto 8px;
}

.action-btn {
  display:flex;
  align-items:center;
  justify-content:center;
  gap:7px;
  padding:11px 15px;
  border:1px solid var(--border);
  border-radius:13px;
  color:var(--text);
  background:var(--surface);
  backdrop-filter:blur(15px);
  cursor:pointer;
  font-size:11px;
  font-weight:800;
  transition:.25s;
}

.action-btn:hover {
  border-color:var(--accent);
  transform:translateY(-3px);
  box-shadow:0 8px 22px rgba(124,58,237,.14);
}

/* SECTIONS */

section {
  margin-top:27px;
  animation:fadeUp .65s ease both;
}

.section-title {
  display:flex;
  align-items:center;
  gap:12px;
  font-size:12px;
  font-weight:900;
  letter-spacing:1px;
  margin:0 2px 14px;
}

.section-title:after {
  content:"";
  height:1px;
  flex:1;
  background:var(--border);
}

/* LINK GRID */

.links {
  display:grid;
  grid-template-columns:repeat(2,minmax(0,1fr));
  gap:11px;
}

.links .link-card:last-child:nth-child(odd) {
  grid-column:1 / -1;
  width:calc(50% - 5.5px);
  justify-self:center;
}

/* APP CARDS */

.link-card {
  --brand:#a78bfa;
  position:relative;
  min-width:0;
  min-height:83px;
  border:1px solid color-mix(in srgb,var(--brand) 40%,transparent);
  border-radius:18px;
  background:linear-gradient(
    135deg,
    color-mix(in srgb,var(--brand) 19%,var(--card)),
    color-mix(in srgb,var(--brand) 7%,var(--card))
  );
  backdrop-filter:blur(18px);
  -webkit-backdrop-filter:blur(18px);
  box-shadow:var(--shadow);
  transition:transform .25s,border-color .25s,box-shadow .25s;
  animation:cardAppear .65s ease both;
}

.link-card:hover {
  transform:translateY(-4px);
  border-color:var(--brand);
  box-shadow:
    0 12px 30px color-mix(in srgb,var(--brand) 20%,transparent),
    var(--shadow);
}

.link-main {
  display:flex;
  align-items:center;
  justify-content:center;
  min-height:81px;
  padding:12px 38px;
  text-align:center;
  text-decoration:none;
  color:var(--text);
}

.info {
  width:100%;
  min-width:0;
  text-align:center;
}

.info strong {
  display:block;
  font-size:12px;
  font-weight:900;
  overflow-wrap:anywhere;
}

.info small {
  display:block;
  margin-top:5px;
  color:var(--muted);
  font-size:10px;
  overflow-wrap:anywhere;
}

/* APP ICONS */

.icon {
  position:absolute;
  inset-inline-start:9px;
  top:50%;
  transform:translateY(-50%);
  width:34px;
  height:34px;
  display:grid;
  place-items:center;
  border-radius:11px;
  color:var(--brand);
  background:color-mix(in srgb,var(--brand) 20%,transparent);
  pointer-events:none;
}

.icon svg {
  width:21px;
  height:21px;
  display:block;
  fill:currentColor;
}

.icon.instagram svg {
  fill:none;
  stroke:currentColor;
  stroke-width:2;
}

.icon.facebook {
  font-family:Arial,sans-serif;
  font-size:25px;
  font-weight:950;
}

.icon.x-icon {
  font-size:23px;
  font-weight:900;
}

.arrow {
  position:absolute;
  inset-inline-end:10px;
  top:50%;
  transform:translateY(-50%);
  color:var(--brand);
  font-size:15px;
  pointer-events:none;
}

/* COPY BUTTON */

.copy-btn {
  position:absolute;
  bottom:6px;
  inset-inline-end:8px;
  z-index:3;
  border:0;
  padding:4px 7px;
  border-radius:7px;
  color:var(--muted);
  background:var(--surface);
  cursor:pointer;
  font-size:9px;
  font-weight:800;
  transition:.2s;
}

.copy-btn:hover {color:var(--brand)}

/* MODAL */

.modal {
  position:fixed;
  inset:0;
  z-index:5000;
  display:none;
  align-items:center;
  justify-content:center;
  padding:20px;
  background:rgba(0,0,0,.7);
  backdrop-filter:blur(9px);
}

.modal.show {display:flex}

.modal-box {
  width:min(100%,350px);
  padding:25px;
  text-align:center;
  border:1px solid var(--border);
  border-radius:23px;
  background:var(--surface);
  backdrop-filter:blur(25px);
  box-shadow:0 25px 80px rgba(0,0,0,.35);
  animation:fadeUp .3s ease both;
}

.modal-box h2 {
  margin:0 0 8px;
  font-size:19px;
}

.modal-box p {
  color:var(--muted);
  font-size:12px;
  line-height:1.7;
}

.qr-image {
  width:205px;
  height:205px;
  max-width:100%;
  margin:15px auto;
  display:block;
  padding:9px;
  border-radius:14px;
  background:white;
}

.modal-buttons {
  display:flex;
  gap:8px;
  justify-content:center;
  flex-wrap:wrap;
  margin-top:15px;
}

/* TOAST */

#toast {
  position:fixed;
  bottom:25px;
  left:50%;
  z-index:7000;
  transform:translate(-50%,20px);
  opacity:0;
  pointer-events:none;
  padding:12px 18px;
  border:1px solid var(--border);
  border-radius:13px;
  background:var(--surface);
  color:var(--text);
  backdrop-filter:blur(20px);
  box-shadow:var(--shadow);
  font-size:12px;
  font-weight:800;
  transition:.3s;
  white-space:nowrap;
}

#toast.show {
  opacity:1;
  transform:translate(-50%,0);
}

/* BACK TO TOP */

#topBtn {
  position:fixed;
  bottom:22px;
  inset-inline-end:18px;
  z-index:1000;
  width:43px;
  height:43px;
  display:grid;
  place-items:center;
  border:1px solid var(--border);
  border-radius:14px;
  color:var(--text);
  background:var(--surface);
  backdrop-filter:blur(15px);
  box-shadow:var(--shadow);
  cursor:pointer;
  opacity:0;
  visibility:hidden;
  transform:translateY(10px);
  transition:.25s;
}

#topBtn.visible {
  opacity:1;
  visibility:visible;
  transform:translateY(0);
}

/* FOOTER */

footer {
  text-align:center;
  padding:43px 10px 15px;
  color:var(--muted);
  font-size:10px;
  line-height:2;
  letter-spacing:1px;
}

footer b {color:var(--accent)}

/* ANIMATIONS */

@keyframes fadeUp {
  from {opacity:0;transform:translateY(17px)}
  to {opacity:1;transform:translateY(0)}
}

@keyframes fadeDown {
  from {opacity:0;transform:translateY(-12px)}
  to {opacity:1;transform:translateY(0)}
}

@keyframes cardAppear {
  from {opacity:0;transform:translateY(12px)}
  to {opacity:1;transform:translateY(0)}
}

/* MOBILE */

@media(max-width:450px) {
  .container {width:calc(100% - 24px)}
  nav {padding:11px}
  .brand {font-size:12px}

  .control {
    padding:8px 9px;
    font-size:10px;
  }

  .dropdown-menu {width:145px}
  header {padding-top:38px}
  .links {gap:9px}

  .links .link-card:last-child:nth-child(odd) {
    width:calc(50% - 4.5px);
  }

  .link-card {
    min-height:80px;
    border-radius:15px;
  }

  .link-main {
    min-height:78px;
    padding:10px 32px;
  }

  .icon {
    width:27px;
    height:27px;
    inset-inline-start:5px;
    border-radius:9px;
  }

  .icon svg {
    width:18px;
    height:18px;
  }

  .info strong {font-size:10px}
  .info small {font-size:9px}

  .arrow {
    inset-inline-end:6px;
    font-size:12px;
  }

  .copy-btn {
    bottom:4px;
    inset-inline-end:5px;
    font-size:8px;
  }

  .action-btn {
    padding:10px 12px;
    font-size:10px;
  }
}

@media(prefers-reduced-motion:reduce) {
  *,*::before,*::after {
    animation:none !important;
    transition:none !important;
    scroll-behavior:auto !important;
  }
}
</style>
</head>

/* PROFILE DATA */

const profile = {

  },

  sections:[
    {
      title:{
