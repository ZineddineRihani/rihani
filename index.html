:root {

body.light {

  --surface:rgba(255,255,255,.92);  
  --card:rgba(255,255,255,.88);  
  --text:#191629;  
  --muted:#77738b;

* {box-sizing:border-box}  
  
html {scroll-behavior:smooth}  
  
body {

  min-height:100vh;  
  overflow-x:hidden;  
  font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;  
  background:

button {font:inherit}  
  
body::before,  
body::after {  
  content:"";  
  position:fixed;  
  width:300px;  
  height:300px;  
  border-radius:50%;

  opacity:.35;

}  
  
body::before {  
  background:#7138db;  
  top:10%;  
  left:-200px;  
}  
  
body::after {

  bottom:5%;  
  right:-220px;

}  
  
@keyframes ambient {  
  from {transform:translate(0,0)}  
  to {transform:translate(100px,70px)}  
}  
  
/* LOADER */  
  
#loader {  
  position:fixed;  
  inset:0;  
  z-index:99999;  
  display:flex;  
  flex-direction:column;  
  align-items:center;  
  justify-content:center;  
  gap:18px;  
  background:#090914;  
  color:white;  
  transition:opacity .5s,visibility .5s;  
}  
  
#loader.hide {  
  opacity:0;  
  visibility:hidden;  
  pointer-events:none;  
}  
  
.loader-logo {  
  font-size:35px;  
  font-weight:950;  
  letter-spacing:4px;  
  background:linear-gradient(120deg,#b69aff,#55aaff);  
  background-clip:text;  
  -webkit-background-clip:text;  
  color:transparent;  
  animation:pulse 1.2s ease-in-out infinite alternate;  
}  
  
.loader-line {  
  width:100px;  
  height:3px;  
  border-radius:10px;

}  
  
@keyframes pulse {  
  to {opacity:.55;transform:scale(.96)}  
}  
  
@keyframes line {  
  from {transform:scaleX(.3)}  
  to {transform:scaleX(1)}  
}  
  
/* LAYOUT */

/* NAVIGATION */  
  
nav {

  gap:10px;

  border-radius:19px;

}  
  
.brand {

  font-weight:950;  
  letter-spacing:1.5px;  
}  
  
.controls {

  z-index:1001;

.dropdown {

.control {

  font-weight:800;

}  
  
.control:hover,  
.control[aria-expanded="true"] {

}  
  
.dropdown-menu {

  max-height:260px;  
  overflow-y:auto;  
  padding:7px;  
  border:1px solid var(--border);  
  border-radius:15px;  
  background:var(--surface);  
  backdrop-filter:blur(25px);  
  -webkit-backdrop-filter:blur(25px);  
  box-shadow:var(--shadow);  
  display:none;  
  animation:fadeUp .2s ease both;  
  isolation:isolate;  
}  
  
.dropdown-menu.open {  
  display:block;  
}  
  
.menu-option {  
  display:flex;  
  align-items:center;  
  justify-content:space-between;  
  width:100%;  
  min-height:40px;  
  padding:11px 10px;  
  border:0;  
  border-radius:9px;  
  background:transparent;  
  color:var(--text);  
  text-align:start;  
  cursor:pointer;  
  font-size:12px;  
  font-weight:700;  
  transition:.2s;  
  -webkit-tap-highlight-color:transparent;  
}  
  
.menu-option:hover,  
.menu-option:focus-visible {  
  background:rgba(167,139,250,.16);  
  outline:none;  
}  
  
.menu-option.active {  
  color:var(--accent);  
  background:rgba(167,139,250,.10);  
}  
  
.option-check {  
  color:var(--blue);  
  font-weight:900;  
}  
  
/* PROFILE */  
  
header {

.avatar {

.avatar img {

  background:var(--surface);  
}  
  
@keyframes avatarGlow {  
  0%,100% {box-shadow:0 10px 28px rgba(124,58,237,.2)}

/* NAME */  
  
.name-line {

  align-items:center;

.verified {

.bio {

.tags {

}  
  
.tag {

  border-radius:30px;  
  background:var(--surface);  
  backdrop-filter:blur(12px);  
  font-size:10px;  
  font-weight:800;  
}  
  
/* CLOCK */  
  
.clock-box {  
  width:max-content;  
  max-width:100%;  
  margin:20px auto 0;  
  padding:10px 17px;  
  border:1px solid var(--border);  
  border-radius:14px;  
  background:var(--surface);  
  backdrop-filter:blur(15px);  
  text-align:center;  
}  
  
.clock-time {  
  font-size:18px;  
  font-weight:900;  
  letter-spacing:1px;  
}  
  
.clock-date {

  color:var(--muted);  
  font-size:10px;  
}  
  
/* ACTIONS */  
  
.actions {

  justify-content:center;  
  flex-wrap:wrap;  
  gap:9px;  
  margin:24px auto 8px;  
}  
  
.action-btn {  
  display:flex;  
  align-items:center;  
  justify-content:center;  
  gap:7px;  
  padding:11px 15px;  
  border:1px solid var(--border);  
  border-radius:13px;  
  color:var(--text);  
  background:var(--surface);  
  backdrop-filter:blur(15px);  
  cursor:pointer;  
  font-size:11px;  
  font-weight:800;  
  transition:.25s;  
}  
  
.action-btn:hover {  
  border-color:var(--accent);  
  transform:translateY(-3px);  
  box-shadow:0 8px 22px rgba(124,58,237,.14);  
}  
  
/* SECTIONS */  
  
section {  
  margin-top:27px;  
  animation:fadeUp .65s ease both;  
}  
  
.section-title {  
  display:flex;  
  align-items:center;  
  gap:12px;  
  font-size:12px;  
  font-weight:900;  
  letter-spacing:1px;  
  margin:0 2px 14px;  
}  
  
.section-title:after {  
  content:"";  
  height:1px;  
  flex:1;  
  background:var(--border);  
}  
  
/* LINK GRID */  
  
.links {  
  display:grid;  
  grid-template-columns:repeat(2,minmax(0,1fr));  
  gap:11px;  
}  
  
.links .link-card:last-child:nth-child(odd) {  
  grid-column:1 / -1;  
  width:calc(50% - 5.5px);  
  justify-self:center;  
}  
  
/* APP CARDS */  
  
.link-card {  
  --brand:#a78bfa;  
  position:relative;  
  min-width:0;  
  min-height:83px;  
  border:1px solid color-mix(in srgb,var(--brand) 40%,transparent);  
  border-radius:18px;  
  background:linear-gradient(  
    135deg,  
    color-mix(in srgb,var(--brand) 19%,var(--card)),  
    color-mix(in srgb,var(--brand) 7%,var(--card))  
  );  
  backdrop-filter:blur(18px);  
  -webkit-backdrop-filter:blur(18px);  
  box-shadow:var(--shadow);  
  transition:transform .25s,border-color .25s,box-shadow .25s;  
  animation:cardAppear .65s ease both;  
}  
  
.link-card:hover {  
  transform:translateY(-4px);  
  border-color:var(--brand);  
  box-shadow:  
    0 12px 30px color-mix(in srgb,var(--brand) 20%,transparent),  
    var(--shadow);  
}  
  
.link-main {  
  display:flex;  
  align-items:center;  
  justify-content:center;  
  min-height:81px;  
  padding:12px 38px;  
  text-align:center;  
  text-decoration:none;  
  color:var(--text);  
}  
  
.info {  
  width:100%;  
  min-width:0;  
  text-align:center;  
}  
  
.info strong {  
  display:block;  
  font-size:12px;  
  font-weight:900;  
  overflow-wrap:anywhere;  
}  
  
.info small {  
  display:block;  
  margin-top:5px;  
  color:var(--muted);  
  font-size:10px;  
  overflow-wrap:anywhere;  
}  
  
/* APP ICONS */  
  
.icon {  
  position:absolute;  
  inset-inline-start:9px;  
  top:50%;  
  transform:translateY(-50%);  
  width:34px;  
  height:34px;  
  display:grid;  
  place-items:center;  
  border-radius:11px;  
  color:var(--brand);  
  background:color-mix(in srgb,var(--brand) 20%,transparent);  
  pointer-events:none;  
}  
  
.icon svg {  
  width:21px;  
  height:21px;  
  display:block;  
  fill:currentColor;  
}  
  
.icon.instagram svg {  
  fill:none;  
  stroke:currentColor;  
  stroke-width:2;  
}  
  
.icon.facebook {  
  font-family:Arial,sans-serif;  
  font-size:25px;  
  font-weight:950;  
}  
  
.icon.x-icon {  
  font-size:23px;  
  font-weight:900;  
}  
  
.arrow {  
  position:absolute;  
  inset-inline-end:10px;  
  top:50%;  
  transform:translateY(-50%);  
  color:var(--brand);  
  font-size:15px;  
  pointer-events:none;  
}  
  
/* COPY BUTTON */  
  
.copy-btn {  
  position:absolute;  
  bottom:6px;  
  inset-inline-end:8px;  
  z-index:3;

  padding:4px 7px;  
  border-radius:7px;  
  color:var(--muted);  
  background:var(--surface);  
  cursor:pointer;  
  font-size:9px;  
  font-weight:800;  
  transition:.2s;  
}  
  
.copy-btn:hover {color:var(--brand)}  
  
/* MODAL */  
  
.modal {  
  position:fixed;  
  inset:0;  
  z-index:5000;  
  display:none;  
  align-items:center;  
  justify-content:center;  
  padding:20px;  
  background:rgba(0,0,0,.7);  
  backdrop-filter:blur(9px);  
}  
  
.modal.show {display:flex}  
  
.modal-box {  
  width:min(100%,350px);  
  padding:25px;  
  text-align:center;  
  border:1px solid var(--border);  
  border-radius:23px;  
  background:var(--surface);  
  backdrop-filter:blur(25px);  
  box-shadow:0 25px 80px rgba(0,0,0,.35);  
  animation:fadeUp .3s ease both;  
}  
  
.modal-box h2 {  
  margin:0 0 8px;  
  font-size:19px;  
}  
  
.modal-box p {  
  color:var(--muted);  
  font-size:12px;  
  line-height:1.7;  
}  
  
.qr-image {  
  width:205px;  
  height:205px;  
  max-width:100%;  
  margin:15px auto;  
  display:block;  
  padding:9px;  
  border-radius:14px;  
  background:white;  
}  
  
.modal-buttons {  
  display:flex;  
  gap:8px;  
  justify-content:center;  
  flex-wrap:wrap;  
  margin-top:15px;  
}  
  
/* TOAST */  
  
#toast {  
  position:fixed;  
  bottom:25px;  
  left:50%;  
  z-index:7000;  
  transform:translate(-50%,20px);  
  opacity:0;  
  pointer-events:none;  
  padding:12px 18px;  
  border:1px solid var(--border);  
  border-radius:13px;  
  background:var(--surface);  
  color:var(--text);  
  backdrop-filter:blur(20px);  
  box-shadow:var(--shadow);  
  font-size:12px;  
  font-weight:800;  
  transition:.3s;  
  white-space:nowrap;  
}  
  
#toast.show {  
  opacity:1;  
  transform:translate(-50%,0);  
}  
  
/* BACK TO TOP */  
  
#topBtn {  
  position:fixed;  
  bottom:22px;  
  inset-inline-end:18px;  
  z-index:1000;  
  width:43px;  
  height:43px;  
  display:grid;  
  place-items:center;  
  border:1px solid var(--border);  
  border-radius:14px;  
  color:var(--text);  
  background:var(--surface);  
  backdrop-filter:blur(15px);  
  box-shadow:var(--shadow);  
  cursor:pointer;  
  opacity:0;  
  visibility:hidden;  
  transform:translateY(10px);  
  transition:.25s;  
}  
  
#topBtn.visible {  
  opacity:1;  
  visibility:visible;  
  transform:translateY(0);  
}  
  
/* FOOTER */  
  
footer {  
  text-align:center;  
  padding:43px 10px 15px;  
  color:var(--muted);  
  font-size:10px;  
  line-height:2;  
  letter-spacing:1px;  
}  
  
footer b {color:var(--accent)}  
  
/* ANIMATIONS */  
  
@keyframes fadeUp {  
  from {opacity:0;transform:translateY(17px)}  
  to {opacity:1;transform:translateY(0)}  
}  
  
@keyframes fadeDown {  
  from {opacity:0;transform:translateY(-12px)}  
  to {opacity:1;transform:translateY(0)}  
}  
  
@keyframes cardAppear {  
  from {opacity:0;transform:translateY(12px)}  
  to {opacity:1;transform:translateY(0)}  
}  
  
/* MOBILE */  
  
@media(max-width:450px) {  
  .container {width:calc(100% - 24px)}  
  nav {padding:11px}  
  .brand {font-size:12px}  
  
  .control {  
    padding:8px 9px;  
    font-size:10px;  
  }  
  
  .dropdown-menu {width:145px}  
  header {padding-top:38px}  
  .links {gap:9px}  
  
  .links .link-card:last-child:nth-child(odd) {  
    width:calc(50% - 4.5px);  
  }  
  
  .link-card {  
    min-height:80px;  
    border-radius:15px;  
  }  
  
  .link-main {  
    min-height:78px;  
    padding:10px 32px;  
  }  
  
  .icon {  
    width:27px;  
    height:27px;  
    inset-inline-start:5px;  
    border-radius:9px;  
  }  
  
  .icon svg {  
    width:18px;  
    height:18px;  
  }  
  
  .info strong {font-size:10px}  
  .info small {font-size:9px}  
  
  .arrow {  
    inset-inline-end:6px;  
    font-size:12px;  
  }  
  
  .copy-btn {  
    bottom:4px;  
    inset-inline-end:5px;  
    font-size:8px;  
  }  
  
  .action-btn {  
    padding:10px 12px;  
    font-size:10px;  
  }  
}  
  
@media(prefers-reduced-motion:reduce) {  
  *,*::before,*::after {  
    animation:none !important;  
    transition:none !important;  
    scroll-behavior:auto !important;  
  }  
}

const $ = id => document.getElementById(id);

let theme = "dark";

  language = localStorage.getItem("rihani-language") || "en";
  theme = localStorage.getItem("rihani-theme") || "dark";
} catch(error) {
  console.warn("Settings storage unavailable.");
}

if (!translations[language]) language = "en";
if (!["dark","light"].includes(theme)) theme = "dark";

/* DROPDOWN CONTROL - FIXED */

function closeMenus() {
  $("langMenu").classList.remove("open");
  $("themeMenu").classList.remove("open");
  $("langBtn").setAttribute("aria-expanded","false");
  $("themeBtn").setAttribute("aria-expanded","false");
}

function toggleMenu(menuName) {
  const menu = $(menuName + "Menu");
  const button = $(menuName + "Btn");
  const wasOpen = menu.classList.contains("open");

  closeMenus();

  if (!wasOpen) {
    menu.classList.add("open");
    button.setAttribute("aria-expanded","true");
  }
}

$("langBtn").addEventListener("click", event => {
  event.preventDefault();
  event.stopPropagation();
  toggleMenu("lang");
});

$("themeBtn").addEventListener("click", event => {
  event.preventDefault();
  event.stopPropagation();
  toggleMenu("theme");
});

/* Close menus only when clicking outside */

document.addEventListener("click", event => {
  if (!event.target.closest("#languageDropdown") &&
      !event.target.closest("#themeDropdown")) {
    closeMenus();
  }
});

/* TOAST */

let toastTimer;

function toast(message) {
  $("toast").textContent = message;
  $("toast").classList.add("show");

  clearTimeout(toastTimer);

  toastTimer = setTimeout(() => {
    $("toast").classList.remove("show");
  },2200);
}

/* COPY */

async function copyText(text) {
  try {
    if (navigator.clipboard && window.isSecureContext) {
      await navigator.clipboard.writeText(text);
    } else {
      const field = document.createElement("textarea");
      field.value = text;
      field.style.position = "fixed";
      field.style.opacity = "0";
      document.body.appendChild(field);
      field.select();

      const success = document.execCommand("copy");
      field.remove();

      if (!success) throw new Error("Copy failed");
    }

    toast(translations[language].copied);
  } catch(error) {
    toast(translations[language].copyError);
  }
}

/* RENDER */

function render() {
  const ar = language === "ar";
  const t = translations[language];

  document.documentElement.lang = language;
  document.documentElement.dir = ar ? "rtl" : "ltr";

  document.body.classList.toggle("light",theme === "light");

  $("subtitle").textContent = profile.subtitle[language];
  $("bio").textContent = profile.bio[language];

  $("langCurrent").textContent = t.language;
  $("themeCurrent").textContent =
    theme === "dark" ? t.themeDark : t.themeLight;

  $("themeBtn").querySelector("span").textContent =
    $("themeCurrent").textContent;

  $("themeBtn").firstChild.textContent =
    theme === "dark" ? "🌙 " : "☀️ ";

  $("footerTop").textContent = t.footer;

  $("qrTitle").textContent = t.qrTitle;
  $("qrDescription").textContent = t.qrDescription;
  $("downloadQR").textContent = t.download;
  $("closeQR").textContent = t.close;

  document.querySelectorAll("[data-translate]").forEach(el => {
    const key = el.dataset.translate;
    if (t[key]) el.textContent = t[key];
  });

  /* LANGUAGE MENU */

  document.querySelectorAll("[data-language]").forEach(btn => {
    const active = btn.dataset.language === language;
    btn.classList.toggle("active",active);
    btn.lastElementChild.textContent = active ? "✓" : "";
  });

  /* THEME MENU */

  document.querySelectorAll("[data-theme]").forEach(btn => {
    const active = btn.dataset.theme === theme;
    btn.classList.toggle("active",active);
    btn.lastElementChild.textContent = active ? "✓" : "";
  });

  /* TAGS */

  $("tags").replaceChildren(
    ...profile.tags[language].map(tag => {
      const el = document.createElement("span");
      el.className = "tag";
      el.textContent = tag;
      return el;
    })
  );

  /* SECTIONS */

  const root = $("sections");
  root.replaceChildren();

  profile.sections.forEach((section,sectionIndex) => {
    const el = document.createElement("section");
    el.style.animationDelay = (sectionIndex * .08) + "s";

    const heading = document.createElement("h2");
    heading.className = "section-title";
    heading.textContent = section.title[language];

    const grid = document.createElement("div");
    grid.className = "links";

    section.links.forEach((item,index) => {
      const card = document.createElement("div");
      card.className = "link-card";
      card.style.setProperty("--brand",item.color);
      card.style.animationDelay = (index * .08) + "s";

      const a = document.createElement("a");
      a.className = "link-main";
      a.href = item.url;
      a.target = "_blank";
      a.rel = "noopener noreferrer";

      const icon = document.createElement("span");
      icon.className = "icon " + item.icon;
      icon.innerHTML = icons[item.icon] || icons.more;

      const info = document.createElement("span");
      info.className = "info";

      const strong = document.createElement("strong");
      strong.textContent =
        typeof item.name === "object"
          ? item.name[language]
          : item.name;

      const small = document.createElement("small");
      small.textContent = item.handle;

      info.append(strong,small);

      const arrow = document.createElement("span");
      arrow.className = "arrow";
      arrow.textContent = "↗";

      a.append(icon,info,arrow);

      const copy = document.createElement("button");
      copy.className = "copy-btn";
      copy.type = "button";
      copy.textContent = t.copy + " ⧉";

      copy.addEventListener("click",() => {
        const name =
          typeof item.name === "object"
            ? item.name[language]
            : item.name;

        copyText(name + "\n" + item.handle + "\n" + item.url);
      });

      card.append(a,copy);
      grid.append(card);
    });

    el.append(heading,grid);
    root.append(el);
  });
}

document.querySelectorAll("[data-language]").forEach(btn => {
  btn.addEventListener("click", event => {
    event.preventDefault();
    event.stopPropagation();

    const selectedLanguage = btn.dataset.language;

    if (!translations[selectedLanguage]) return;

    language = selectedLanguage;

    try {
      localStorage.setItem("rihani-language",language);
    } catch(error) {}

    closeMenus();
    render();
    updateClock();

});

    theme = selectedTheme;

    closeMenus();
    render();

/* CLOCK */

function updateClock() {
  const now = new Date();

  const locale =
    language === "ar" ? "ar-DZ" :
    language === "fr" ? "fr-FR" :
    language === "es" ? "es-ES" : "en-GB";

  $("clockTime").textContent =
    new Intl.DateTimeFormat(locale,{
      hour:"2-digit",
      minute:"2-digit",
      second:"2-digit",
      hour12:false
    }).format(now);

  $("clockDate").textContent =
    new Intl.DateTimeFormat(locale,{
      weekday:"long",
      day:"numeric",
      month:"long",
      year:"numeric"
    }).format(now);
}

updateClock();
setInterval(updateClock,1000);

/* SHARE */

$("shareBtn").addEventListener("click",async () => {
  const shareData = {
    title:"Zed's Infos | ZINEDDINE",
    text:profile.bio[language],
    url:window.location.href
  };

  try {
    if (navigator.share) {
      await navigator.share(shareData);
    } else {
      await copyText(window.location.href);
    }
  } catch(error) {
    if (error.name !== "AbortError") {
      await copyText(window.location.href);
    }
  }
});

/* QR CODE */

function createQR() {
  const website = window.location.href;

  const qrURL =
    "https://api.qrserver.com/v1/create-qr-code/?size=500x500&format=png&data="
    + encodeURIComponent(website);

  $("qrImage").src = qrURL;
  $("qrAddress").textContent = website;

  return qrURL;
}

$("qrBtn").addEventListener("click",() => {
  createQR();
  $("qrModal").classList.add("show");
});

$("closeQR").addEventListener("click",() => {
  $("qrModal").classList.remove("show");
});

$("qrModal").addEventListener("click",event => {
  if (event.target === $("qrModal")) {
    $("qrModal").classList.remove("show");
  }
});

/* DOWNLOAD QR */

$("downloadQR").addEventListener("click",async () => {
  const url = createQR();

  try {
    const response = await fetch(url);
    if (!response.ok) throw new Error("QR unavailable");

    const blob = await response.blob();
    const objectURL = URL.createObjectURL(blob);

    const a = document.createElement("a");
    a.href = objectURL;
    a.download = "Zeds-Infos-QR.png";

    document.body.appendChild(a);
    a.click();
    a.remove();

    URL.revokeObjectURL(objectURL);
  } catch(error) {
    window.open(url,"_blank");
  }
});

/* COPY ALL LINKS */

$("copyAllBtn").addEventListener("click",() => {
  const all = profile.sections.map(section => {
    const title = section.title[language];

    const links = section.links.map(item => {
      const name =
        typeof item.name === "object"
          ? item.name[language]
          : item.name;

      return name + "\n" + item.handle + "\n" + item.url;
    }).join("\n\n");

    return title + "\n" + links;
  }).join("\n\n--------------------\n\n");

  copyText("Zed's Infos — ZINEDDINE\n\n" + all);
});
