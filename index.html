<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
  <meta name="google-site-verification" content="nejq3Zn8iJajgKG1S4YVXAZxIj4J1CBxq98VRJ4eNlQ" />
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#090805">
  <title>Zed's Infos | ZINEDDINE</title>
  <meta name="description" content="Zed's Infos — Official personal hub of ZINEDDINE. Find all social media accounts and contact links in one place.">
  <meta name="keywords" content="ZINEDDINE, Zed's Infos, RIHANI, Instagram, Snapchat, Facebook, Telegram, WhatsApp">
  <meta name="author" content="ZINEDDINE">
  <meta name="robots" content="index, follow">
  <meta property="og:type" content="website">
  <meta property="og:title" content="Zed's Infos | ZINEDDINE">
  <meta property="og:description" content="All my profiles and ways to connect in one place.">
  <meta property="og:image" content="https://raw.githubusercontent.com/ZineddineRihani/rihani/main/profile.png">
  <meta name="twitter:card" content="summary_large_image">
  <style>
  :root {
    --bg:#090805;
    --surface:rgba(25,22,15,.58);
    --card:rgba(30,26,17,.48);
    --text:#fff9e9;
    --muted:#b6a985;
    --border:rgba(233,189,88,.22);
    --accent:#e6b94f;
    --blue:#d6a642;
    --shadow:0 18px 55px rgba(0,0,0,.35);
    --glass-blur:22px;
  }

  body.light {
    --bg:#f6f0df;
    --surface:rgba(255,251,238,.67);
    --card:rgba(255,248,226,.57);
    --text:#261c0b;
    --muted:#82734f;
    --border:rgba(153,111,34,.22);
    --accent:#a8751d;
    --blue:#b8862b;
    --shadow:0 15px 40px rgba(90,65,20,.09);
  }

  * {box-sizing:border-box}
  html {scroll-behavior:smooth}

  body {
    margin:0;
    min-height:100vh;
    overflow-x:hidden;
    font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;
    background:
      radial-gradient(ellipse at 10% 5%,rgba(190,139,35,.18),transparent 38%),
      radial-gradient(ellipse at 95% 45%,rgba(218,172,75,.11),transparent 38%),
      var(--bg);
    color:var(--text);
    transition:background .3s,color .3s;
  }

  button {font:inherit}

  body::before,
  body::after {
    content:"";
    position:fixed;
    width:300px;
    height:300px;
    border-radius:50%;
    filter:blur(100px);
    pointer-events:none;
    z-index:-1;
    opacity:.35;
    animation:ambient 14s ease-in-out infinite alternate;
  }

  body::before { background:#b8862b; top:10%; left:-200px; }
  body::after { background:#e5bd62; bottom:5%; right:-220px; animation-delay:3s; }

  @keyframes ambient {
    from {transform:translate(0,0)}
    to {transform:translate(100px,70px)}
  }

  /* LOADER */
  #loader {
    position:fixed;
    inset:0;
    z-index:99999;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    gap:18px;
    background:#090805;
    color:white;
    transition:opacity .5s,visibility .5s;
  }

  #loader.hide {
    opacity:0;
    visibility:hidden;
    pointer-events:none;
  }

  .loader-logo {
    font-size:35px;
    font-weight:950;
    letter-spacing:4px;
    background:linear-gradient(120deg,#fff0b5,#d6a642,#a8751d);
    background-clip:text;
    -webkit-background-clip:text;
    color:transparent;
    animation:pulse 1.2s ease-in-out infinite alternate;
  }

  .loader-line {
    width:100px;
    height:3px;
    border-radius:10px;
    background:linear-gradient(90deg,#a8751d,#ffe6a6,#d6a642);
    animation:line 1s ease-in-out infinite alternate;
  }

  @keyframes pulse { to {opacity:.55;transform:scale(.96)} }
  @keyframes line { from {transform:scaleX(.3)} to {transform:scaleX(1)} }

  .container {
    width:min(100% - 32px,760px);
    margin:auto;
    padding:22px 0 30px;
  }

  /* NAVIGATION */
  nav {
    position:relative;
    z-index:1000;
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:10px;
    padding:13px 15px;
    border:1px solid var(--border);
    border-radius:19px;
    background:var(--surface);
    backdrop-filter:blur(var(--glass-blur));
    -webkit-backdrop-filter:blur(var(--glass-blur));
    box-shadow:var(--shadow);
    animation:fadeDown .7s ease both;
  }

  .brand {
    font-size:15px;
    font-weight:950;
    letter-spacing:1.5px;
    display:flex;
    align-items:center;
    gap:7px;
  }

  .brand::before {
    content:"♛";
    color:var(--accent);
    font-size:20px;
    text-shadow:0 0 12px rgba(230,185,79,.5);
  }

  .controls {
    position:relative;
    z-index:1001;
    display:flex;
    align-items:center;
    gap:7px;
  }

  .dropdown {
    position:relative;
    z-index:1002;
  }

  .control {
    display:flex;
    align-items:center;
    gap:7px;
    border:1px solid var(--border);
    background:var(--card);
    color:var(--text);
    padding:9px 11px;
    border-radius:11px;
    cursor:pointer;
    font-size:11px;
    font-weight:800;
    transition:.25s;
    white-space:nowrap;
    backdrop-filter:blur(15px);
    -webkit-backdrop-filter:blur(15px);
  }

  .control:hover,
  .control[aria-expanded="true"] {
    border-color:var(--accent);
  }

  .dropdown-menu {
    position:absolute;
    top:calc(100% + 9px);
    inset-inline-end:0;
    z-index:9999;
    width:155px;
    max-height:260px;
    overflow-y:auto;
    padding:7px;
    border:1px solid var(--border);
    border-radius:15px;
    background:var(--surface);
    backdrop-filter:blur(25px);
    -webkit-backdrop-filter:blur(25px);
    box-shadow:var(--shadow);
    display:none;
    animation:fadeUp .2s ease both;
    isolation:isolate;
  }

  .dropdown-menu.open { display:block; }

  .menu-option {
    display:flex;
    align-items:center;
    justify-content:space-between;
    width:100%;
    min-height:40px;
    padding:11px 10px;
    border:0;
    border-radius:9px;
    background:transparent;
    color:var(--text);
    text-align:start;
    cursor:pointer;
    font-size:12px;
    font-weight:700;
    transition:.2s;
    -webkit-tap-highlight-color:transparent;
  }

  .menu-option:hover,
  .menu-option:focus-visible {
    background:rgba(230,185,79,.16);
    outline:none;
  }

  .menu-option.active {
    color:var(--accent);
    background:rgba(230,185,79,.10);
  }

  /* PROFILE */
  header {
    text-align:center;
    padding:48px 12px 28px;
    animation:fadeUp .8s ease .1s both;
  }

  .avatar {
    width:116px;
    height:116px;
    margin:0 auto 20px;
    padding:3px;
    border-radius:35px;
    background:linear-gradient(135deg,#fff0b5,#a8751d,#e6b94f);
    box-shadow:0 12px 40px rgba(190,139,35,.28);
    animation:avatarGlow 4s ease-in-out infinite;
  }

  .avatar img {
    width:100%;
    height:100%;
    object-fit:cover;
    border-radius:32px;
    background:var(--surface);
  }

  @keyframes avatarGlow {
    0%,100% {box-shadow:0 10px 28px rgba(190,139,35,.2)}
    50% {box-shadow:0 12px 48px rgba(230,185,79,.38)}
  }

  .name-line {
    display:flex;
    justify-content:center;
    align-items:center;
    gap:7px;
    margin:0;
  }

  .name-line h1 {
    margin:0;
    font-size:clamp(23px,5vw,29px);
    font-weight:950;
    letter-spacing:1.4px;
  }

  .verified-badge {
    width:24px;
    height:24px;
    display:inline-flex;
    align-items:center;
    justify-content:center;
    flex-shrink:0;
    filter:drop-shadow(0 2px 8px rgba(29, 155, 240, 0.45));
  }

  .verified-badge svg {
    width:100%;
    height:100%;
    display:block;
  }

  .bio {
    max-width:430px;
    margin:14px auto 0;
    color:var(--muted);
    line-height:1.8;
    font-size:12px;
    font-weight:800;
    letter-spacing:2px;
  }

  .tags {
    display:flex;
    justify-content:center;
    flex-wrap:wrap;
    gap:9px;
    margin-top:20px;
  }

  .tag {
    padding:8px 13px;
    border:1px solid var(--border);
    border-radius:30px;
    background:var(--surface);
    backdrop-filter:blur(15px);
    -webkit-backdrop-filter:blur(15px);
    font-size:10px;
    font-weight:800;
    letter-spacing:.5px;
    box-shadow:0 5px 18px rgba(0,0,0,.08);
  }

  .tag:first-child {
    color:var(--accent);
    border-color:rgba(230,185,79,.4);
    background:rgba(230,185,79,.09);
  }

  /* CLOCK */
  .clock-box {
    width:max-content;
    max-width:100%;
    margin:20px auto 0;
    padding:10px 17px;
    border:1px solid var(--border);
    border-radius:14px;
    background:var(--surface);
    backdrop-filter:blur(18px);
    -webkit-backdrop-filter:blur(18px);
    text-align:center;
    box-shadow:0 8px 25px rgba(0,0,0,.1);
  }

  .clock-time { font-size:18px; font-weight:900; letter-spacing:1px; }
  .clock-date { margin-top:3px; color:var(--muted); font-size:10px; }

  /* ACTIONS */
  .actions {
    display:flex;
    justify-content:center;
    flex-wrap:wrap;
    gap:9px;
    margin:24px auto 8px;
  }

  .action-btn {
    display:flex;
    align-items:center;
    justify-content:center;
    gap:7px;
    padding:11px 15px;
    border:1px solid var(--border);
    border-radius:13px;
    color:var(--text);
    background:var(--surface);
    backdrop-filter:blur(18px);
    -webkit-backdrop-filter:blur(18px);
    box-shadow:0 8px 25px rgba(0,0,0,.08);
    cursor:pointer;
    font-size:11px;
    font-weight:800;
    transition:.25s;
  }

  .action-btn:hover {
    border-color:var(--accent);
    transform:translateY(-3px);
    box-shadow:0 8px 22px rgba(190,139,35,.14);
  }

  .action-btn.primary {
    border-color:var(--accent);
    background:linear-gradient(135deg,rgba(230,185,79,.25),rgba(168,117,29,.22));
    color:var(--text);
  }

  /* SECTIONS */
  section {
    margin-top:27px;
    animation:fadeUp .65s ease both;
  }

  .section-title {
    display:flex;
    align-items:center;
    gap:12px;
    font-size:12px;
    font-weight:900;
    letter-spacing:1px;
    margin:0 2px 14px;
  }

  .section-title::before {
    content:"♛";
    color:var(--accent);
    font-size:16px;
    text-shadow:0 0 10px rgba(230,185,79,.4);
  }

  .section-title:after {
    content:"";
    height:1px;
    flex:1;
    background:var(--border);
  }

  /* ABOUT ME */
  .about-gate-card {
    border:1px solid rgba(233,189,88,.27);
    border-radius:18px;
    padding:18px;
    background:
      linear-gradient(135deg, rgba(255,255,255,.055), rgba(190,139,35,.055), rgba(255,255,255,.025)),
      var(--card);
    backdrop-filter:blur(24px) saturate(145%);
    -webkit-backdrop-filter:blur(24px) saturate(145%);
    box-shadow: inset 0 1px 0 rgba(255,255,255,.07), 0 12px 35px rgba(0,0,0,.18);
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:14px;
    flex-wrap:wrap;
  }

  .about-gate-copy strong {
    display:block;
    font-size:13px;
    font-weight:900;
    margin-bottom:4px;
  }

  .about-gate-copy small {
    display:block;
    color:var(--muted);
    font-size:11px;
    line-height:1.6;
  }

  .about-article {
    display:none;
    border:1px solid rgba(233,189,88,.27);
    border-radius:18px;
    padding:20px;
    background:
      linear-gradient(135deg, rgba(255,255,255,.055), rgba(190,139,35,.055), rgba(255,255,255,.025)),
      var(--card);
    backdrop-filter:blur(24px) saturate(145%);
    -webkit-backdrop-filter:blur(24px) saturate(145%);
    box-shadow: inset 0 1px 0 rgba(255,255,255,.07), 0 12px 35px rgba(0,0,0,.18);
    animation:fadeUp .35s ease both;
  }

  .about-article.open {
    display:block;
  }

  .about-header {
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:10px;
    flex-wrap:wrap;
    padding-bottom:12px;
    margin-bottom:14px;
    border-bottom:1px solid var(--border);
  }

  .about-badge {
    display:inline-flex;
    align-items:center;
    gap:6px;
    padding:5px 11px;
    border-radius:999px;
    font-size:10px;
    font-weight:800;
    color:var(--accent);
    background:rgba(230,185,79,.12);
    border:1px solid rgba(230,185,79,.32);
  }

  .about-lead {
    margin:0 0 12px;
    font-size:14px;
    font-weight:900;
    line-height:1.7;
  }

  .about-paragraph {
    margin:0 0 14px;
    color:var(--muted);
    font-size:12px;
    line-height:1.9;
  }

  .about-certs {
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(150px,1fr));
    gap:9px;
    margin:14px 0 16px;
  }

  .about-cert-item {
    padding:10px 12px;
    border-radius:13px;
    border:1px solid var(--border);
    background:var(--surface);
    font-size:11px;
    font-weight:800;
    text-align:center;
  }

  .about-footer-bar {
    display:flex;
    justify-content:flex-end;
    margin-top:8px;
  }

  /* LINK GRID */
  .links {
    display:grid;
    grid-template-columns:repeat(2,minmax(0,1fr));
    gap:11px;
  }

  .links .link-card:last-child:nth-child(odd) {
    grid-column:1 / -1;
    width:100%;
  }

  /* GLASS APP CARDS */
  .link-card {
    --brand:#d6a642;
    position:relative;
    min-width:0;
    min-height:83px;
    border:1px solid rgba(233,189,88,.27);
    border-radius:18px;
    background:
      linear-gradient(135deg, rgba(255,255,255,.055), rgba(190,139,35,.055), rgba(255,255,255,.025)),
      var(--card);
    backdrop-filter:blur(24px) saturate(145%);
    -webkit-backdrop-filter:blur(24px) saturate(145%);
    box-shadow: inset 0 1px 0 rgba(255,255,255,.07), 0 12px 35px rgba(0,0,0,.18);
    transition:transform .25s,border-color .25s,box-shadow .25s;
    animation:cardAppear .65s ease both;
    overflow:hidden;
  }

  .link-card::before {
    content:"";
    position:absolute;
    inset:0;
    background:linear-gradient(120deg, transparent 20%, rgba(255,255,255,.055) 48%, transparent 75%);
    pointer-events:none;
    opacity:.7;
  }

  .link-card:hover {
    transform:translateY(-4px);
    border-color:var(--accent);
    box-shadow: inset 0 1px 0 rgba(255,255,255,.12), 0 12px 30px rgba(190,139,35,.17), var(--shadow);
  }

  .link-main {
    position:relative;
    z-index:1;
    display:flex;
    align-items:center;
    justify-content:center;
    min-height:81px;
    padding:12px 38px;
    text-align:center;
    text-decoration:none;
    color:var(--text);
    cursor:pointer;
  }

  .info {
    width:100%;
    min-width:0;
    text-align:center;
  }

  .info strong {
    display:block;
    font-size:12px;
    font-weight:900;
    overflow-wrap:anywhere;
  }

  .info small {
    display:block;
    margin-top:5px;
    color:var(--muted);
    font-size:10px;
    overflow-wrap:anywhere;
  }

  .icon {
    --brand:#d6a642;
    position:absolute;
    inset-inline-start:9px;
    top:50%;
    transform:translateY(-50%);
    width:34px;
    height:34px;
    display:grid;
    place-items:center;
    border-radius:11px;
    color:var(--brand);
    background:color-mix(in srgb,var(--brand) 15%,transparent);
    border:1px solid color-mix(in srgb,var(--brand) 35%,transparent);
    box-shadow:0 4px 14px color-mix(in srgb,var(--brand) 13%,transparent);
    pointer-events:none;
  }

  .icon svg {
    width:21px;
    height:21px;
    display:block;
    fill:currentColor;
  }

  .icon.instagram svg { fill:none; stroke:currentColor; stroke-width:2; }

  .arrow {
    position:absolute;
    inset-inline-end:10px;
    top:50%;
    transform:translateY(-50%);
    color:var(--accent);
    font-size:15px;
    pointer-events:none;
  }

  /* MODAL */
  .modal {
    position:fixed;
    inset:0;
    z-index:5000;
    display:none;
    align-items:center;
    justify-content:center;
    padding:20px;
    background:rgba(0,0,0,.72);
    backdrop-filter:blur(10px);
    -webkit-backdrop-filter:blur(10px);
  }

  .modal.show {display:flex}

  .modal-box {
    width:min(100%,390px);
    padding:25px 22px;
    text-align:center;
    border:1px solid var(--border);
    border-radius:24px;
    background:var(--surface);
    backdrop-filter:blur(28px);
    -webkit-backdrop-filter:blur(28px);
    box-shadow:0 25px 80px rgba(0,0,0,.45);
    animation:fadeUp .3s ease both;
  }

  .warning-icon {
    width:46px;
    height:46px;
    margin:0 auto 12px;
    border-radius:15px;
    display:grid;
    place-items:center;
    font-size:22px;
    color:var(--accent);
    background:rgba(230,185,79,.14);
    border:1px solid rgba(230,185,79,.36);
  }

  .modal-box h2 {
    margin:0 0 8px;
    font-size:18px;
    font-weight:900;
    line-height:1.5;
  }

  .modal-box p {
    color:var(--muted);
    font-size:12px;
    line-height:1.7;
    margin:0 0 14px;
  }

  .sub-accounts-list {
    display:flex;
    flex-direction:column;
    gap:10px;
    margin:16px 0;
    max-height:280px;
    overflow-y:auto;
  }

  .sub-account-row {
    display:flex;
    align-items:stretch;
    gap:7px;
  }

  .sub-account-card {
    flex:1;
    min-width:0;
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:8px;
    padding:13px 14px;
    background:var(--card);
    border:1px solid var(--border);
    border-radius:15px;
    text-decoration:none;
    color:var(--text);
    transition:.2s;
    text-align:start;
  }

  .sub-account-card:hover {
    border-color:var(--accent);
    transform:translateY(-2px);
    background:rgba(230,185,79,.08);
  }

  .sub-account-card strong {
    display:block;
    font-size:12px;
    font-weight:800;
    margin-bottom:3px;
  }

  .sub-account-card small {
    display:block;
    color:var(--muted);
    font-size:11px;
    overflow-wrap:anywhere;
  }

  .sub-account-arrow {
    color:var(--accent);
    font-size:14px;
    font-weight:700;
    flex-shrink:0;
  }

  .qr-image {
    width:205px;
    height:205px;
    max-width:100%;
    margin:15px auto;
    display:block;
    padding:9px;
    border-radius:14px;
    background:white;
  }

  .modal-buttons {
    display:flex;
    gap:8px;
    justify-content:center;
    flex-wrap:wrap;
    margin-top:16px;
  }

  /* TOAST */
  #toast {
    position:fixed;
    bottom:22px;
    left:50%;
    transform:translate(-50%, 16px);
    z-index:10000;
    padding:10px 16px;
    border-radius:12px;
    border:1px solid var(--border);
    background:var(--surface);
    color:var(--text);
    backdrop-filter:blur(20px);
    -webkit-backdrop-filter:blur(20px);
    box-shadow:var(--shadow);
    font-size:11px;
    font-weight:800;
    opacity:0;
    visibility:hidden;
    pointer-events:none;
    transition:.25s;
    white-space:nowrap;
  }

  #toast.show {
    opacity:1;
    visibility:visible;
    transform:translate(-50%, 0);
  }

  /* BACK TO TOP */
  #topBtn {
    position:fixed;
    bottom:22px;
    inset-inline-end:18px;
    z-index:1000;
    width:43px;
    height:43px;
    display:grid;
    place-items:center;
    border:1px solid var(--border);
    border-radius:14px;
    color:var(--text);
    background:var(--surface);
    backdrop-filter:blur(18px);
    -webkit-backdrop-filter:blur(18px);
    box-shadow:var(--shadow);
    cursor:pointer;
    opacity:0;
    visibility:hidden;
    transform:translateY(10px);
    transition:.25s;
  }

  #topBtn.visible {
    opacity:1;
    visibility:visible;
    transform:translateY(0);
  }

  footer {
    text-align:center;
    padding:43px 10px 15px;
    color:var(--muted);
    font-size:10px;
    line-height:2;
    letter-spacing:1px;
  }

  footer b {color:var(--accent)}

  @keyframes fadeUp {
    from {opacity:0;transform:translateY(17px)}
    to {opacity:1;transform:translateY(0)}
  }

  @keyframes fadeDown {
    from {opacity:0;transform:translateY(-12px)}
    to {opacity:1;transform:translateY(0)}
  }

    whatsapp:`<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2a9.7 9.7 0 0 0-8.4 14.5L2.3 22l5.7-1.5A9.8 9.8 0 1 0 12 2zm0 17.8c-1.5 0-2.9-.4-4.1-1.2l-.3-.2-3.4.9.9-3.3-.2-.3A8 8 0 1 1 12 19.8zm4.4-6c-.2-.1-1.4-.7-1.6-.8-.2-.1-.4-.1-.5.1-.2.2-.6.8-.8.9-.1.2-.3.2-.5.1-.2-.1-1-.4-1.9-1.2-.7-.6-1.2-1.4-1.3-1.6-.1-.2 0-.3.1-.5l.4-.4c.1-.1.2-.3.3-.4.1-.2 0-.3 0-.4 0-.1-.5-1.3-.7-1.8-.2-.5-.4-.4-.5-.4h-.5c-.2 0-.4.1-.6.3-.2.2-.8.8-.8 1.9s.8 2.2.9 2.3c.1.2 1.6 2.5 3.9 3.5.5.2.9.4 1.2.5.5.2 1 .2 1.3.1.4-.1 1.4-.6 1.6-1.1.2-.5.2-1 .1-1.1-.1-.1-.2-.2-.4-.3z" fill="currentColor"/></svg>`,
    facebook:`<span style="font-family:Arial,sans-serif;font-size:27px;font-weight:950;line-height:1">f</span>`,
    x:`<span style="font-size:23px;font-weight:900;line-height:1">𝕏</span>`,
    more:`<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M14 3h7v7h-2V6.4l-9.3 9.3-1.4-1.4L17.6 5H14V3zM5 5h6v2H5v12h12v-6h2v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V7a2 2 0 0 1 2-2z" fill="currentColor"/></svg>`,
    email:`<svg viewBox="0 0 24 24" aria-hidden="true"><rect x="2" y="4" width="20" height="16" rx="3" fill="none" stroke="currentColor" stroke-width="2"/><path d="m3 6 9 7 9-7" fill="none" stroke="currentColor" stroke-width="2"/></svg>`,
    phone:`<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6.6 2h3.1l1.5 5-2 1.8a16 16 0 0 0 6 6l1.8-2 5 1.5v3.1c0 1.4-1.1 2.6-2.5 2.6C10.5 20 4 13.5 4 5.5 4 4.1 5.2 3 6.6 3z" fill="currentColor"/></svg>`
  };

  const $ = id => document.getElementById(id);
  let language = "en";
  let theme = "dark";
  let aboutUnlocked = false;
  let lastFocusedEl = null;
  let toastTimer = null;

  try {
    language = localStorage.getItem("rihani-language") || "en";
    theme = localStorage.getItem("rihani-theme") || "dark";
  } catch(e) {}

  if (!translations[language]) language = "en";
  if (!["dark","light"].includes(theme)) theme = "dark";

  function showToast(msg) {
    const el = $("toast");
    el.textContent = msg;
    el.classList.add("show");
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => el.classList.remove("show"), 1800);
  }

  async function copyText(text) {
    try {
      await navigator.clipboard.writeText(text);
      showToast(translations[language].copied);
      return true;
    } catch(e) {
      return false;
    }
  }

  function closeMenus() {
    $("langMenu").classList.remove("open");
    $("themeMenu").classList.remove("open");
    $("langBtn").setAttribute("aria-expanded","false");
    $("themeBtn").setAttribute("aria-expanded","false");
  }

  function toggleMenu(menuName) {
    const menu = $(menuName + "Menu");
    const button = $(menuName + "Btn");
    const wasOpen = menu.classList.contains("open");
    closeMenus();
    if (!wasOpen) {
      menu.classList.add("open");
      button.setAttribute("aria-expanded","true");
    }
  }

  $("langBtn").addEventListener("click", e => { e.stopPropagation(); toggleMenu("lang"); });
  $("themeBtn").addEventListener("click", e => { e.stopPropagation(); toggleMenu("theme"); });
  document.addEventListener("click", () => closeMenus());

  function renderAboutSection() {
    const ab = profile.about[language] || profile.about.en;
    $("aboutGateHeading").textContent = ab.gateHeading;
    $("aboutGateSub").textContent = ab.gateSub;
    $("openAboutBtn").textContent = ab.openBtn;
    $("aboutWarningTitle").textContent = ab.warningTitle;
    $("aboutWarningDesc").textContent = ab.warningDesc;
    $("confirmAboutYes").textContent = ab.yesBtn;
    $("confirmAboutNo").textContent = ab.noBtn;
    $("aboutBadge").textContent = ab.badge;
    $("backToLinksBtn").textContent = ab.backBtn;
    $("closeAboutArticleBtn").textContent = ab.hideBtn;
    $("aboutLead").textContent = ab.lead;
    $("aboutBody1").textContent = ab.body1;
    $("aboutBody2").textContent = ab.body2;

    $("aboutCerts").replaceChildren(
      ...ab.certs.map(cert => {
        const div = document.createElement("div");
        div.className = "about-cert-item";
        div.textContent = cert;
        return div;
      })
    );

    $("aboutArticle").classList.toggle("open", aboutUnlocked);
    $("aboutGateCard").style.display = aboutUnlocked ? "none" : "flex";
  }

  function openAboutWarning(triggerEl) {
    lastFocusedEl = triggerEl || document.activeElement;
    renderAboutSection();
    $("aboutWarningModal").classList.add("show");
    $("confirmAboutNo").focus();
  }

  function closeAboutWarning(returnToLinks = false) {
    $("aboutWarningModal").classList.remove("show");
    if (returnToLinks) {
      aboutUnlocked = false;
      renderAboutSection();
      const firstSection = document.querySelector("#sections section");
      if (firstSection) firstSection.scrollIntoView({ behavior:"smooth", block:"start" });
    }
    if (lastFocusedEl && typeof lastFocusedEl.focus === "function") {
      lastFocusedEl.focus();
      lastFocusedEl = null;
    }
  }

  $("openAboutBtn").addEventListener("click", () => openAboutWarning($("openAboutBtn")));
  $("confirmAboutNo").addEventListener("click", () => closeAboutWarning(true));
  $("aboutWarningModal").addEventListener("click", e => {
    if (e.target === $("aboutWarningModal")) closeAboutWarning(true);
  });

  $("confirmAboutYes").addEventListener("click", () => {
    $("aboutWarningModal").classList.remove("show");
    aboutUnlocked = true;
    renderAboutSection();
    $("aboutArticle").scrollIntoView({ behavior:"smooth", block:"nearest" });
    $("backToLinksBtn").focus();
  });

  $("backToLinksBtn").addEventListener("click", () => {
    aboutUnlocked = false;
    renderAboutSection();
    const firstSection = document.querySelector("#sections section");
    if (firstSection) firstSection.scrollIntoView({ behavior:"smooth", block:"start" });
    $("openAboutBtn").focus();
  });

  $("closeAboutArticleBtn").addEventListener("click", () => {
    aboutUnlocked = false;
    renderAboutSection();
    $("openAboutBtn").focus();
  });

  function render() {
    const t = translations[language];
    document.documentElement.lang = language;
    document.documentElement.dir = language === "ar" ? "rtl" : "ltr";
    document.body.classList.toggle("light", theme === "light");

    $("bio").textContent = profile.bio[language];
    $("langCurrent").textContent = t.language;
    $("themeCurrent").textContent = theme === "dark" ? t.themeDark : t.themeLight;
    $("themeBtn").querySelector("span").textContent = $("themeCurrent").textContent;
    $("themeBtn").firstChild.textContent = theme === "dark" ? "🌙 " : "☀️ ";
    $("aboutMeTitle").textContent = t.aboutMe;
    $("footerTop").textContent = t.footer;
    $("qrTitle").textContent = t.qrTitle;
    $("qrDescription").textContent = t.qrDescription;
    $("downloadQR").textContent = t.download;
    $("closeQR").textContent = t.close;
    $("closeMultiModal").textContent = t.close;

    document.querySelectorAll("[data-translate]").forEach(el => {
      const key = el.dataset.translate;
      if (t[key]) el.textContent = t[key];
    });

    document.querySelectorAll("[data-language]").forEach(btn => {
      const active = btn.dataset.language === language;
      btn.classList.toggle("active", active);
      btn.lastElementChild.textContent = active ? "✓" : "";
    });

    document.querySelectorAll("[data-theme]").forEach(btn => {
      const active = btn.dataset.theme === theme;
      btn.classList.toggle("active", active);
      btn.lastElementChild.textContent = active ? "✓" : "";
    });

    $("tags").replaceChildren(
      ...profile.tags[language].map(tag => {
        const el = document.createElement("span");
        el.className = "tag";
        el.textContent = tag;
        return el;
      })
    );

    const root = $("sections");
    root.replaceChildren();

    profile.sections.forEach((section, sIndex) => {
      const el = document.createElement("section");
      el.style.animationDelay = (sIndex * .08) + "s";

      const heading = document.createElement("h2");
      heading.className = "section-title";
      heading.textContent = section.title[language];

      const grid = document.createElement("div");
      grid.className = "links";

      section.links.forEach((item, index) => {
        const card = document.createElement("div");
        card.className = "link-card";
        card.style.setProperty("--brand", item.color);
        card.style.animationDelay = (index * .08) + "s";

        const a = document.createElement("a");
        a.className = "link-main";

        if (item.isMulti) {
          a.setAttribute("role", "button");
          a.setAttribute("tabindex", "0");
          a.addEventListener("click", () => openMultiModal(item, a));
          a.addEventListener("keydown", e => {
            if (e.key === "Enter" || e.key === " ") {
              e.preventDefault();
              openMultiModal(item, a);
            }
          });
        } else {
          a.href = item.url;
          if (!item.url.startsWith("tel:") && !item.url.startsWith("mailto:")) {
            a.target = "_blank";
            a.rel = "noopener noreferrer";
          }
        }

        const icon = document.createElement("span");
        icon.className = "icon " + item.icon;
        icon.innerHTML = icons[item.icon] || icons.more;
        let iconColor = item.color;
        if (item.icon === "x") iconColor = theme === "dark" ? "#FFFFFF" : "#111111";
        if (item.icon === "snapchat") iconColor = theme === "dark" ? "#FFFC00" : "#d4a800";
        icon.style.setProperty("--brand", iconColor);

        const info = document.createElement("span");
        info.className = "info";

        const strong = document.createElement("strong");
        strong.textContent = typeof item.name === "object" ? item.name[language] : item.name;

        const small = document.createElement("small");
        small.textContent = typeof item.handle === "object" ? item.handle[language] : item.handle;

        info.append(strong, small);

        const arrow = document.createElement("span");
        arrow.className = "arrow";
        arrow.textContent = "↗";

        a.append(icon, info, arrow);
        card.append(a);
        grid.append(card);
      });

      el.append(heading, grid);
      root.append(el);
    });

    renderAboutSection();
  }

  function openMultiModal(item, triggerEl) {
    lastFocusedEl = triggerEl || document.activeElement;
    const t = translations[language];
    $("multiModalTitle").textContent = typeof item.name === "object" ? item.name[language] : item.name;
    $("multiModalDesc").textContent = t.multiDesc;

    const list = $("subAccountsList");
    list.replaceChildren();

    item.accounts.forEach(acc => {
      const row = document.createElement("div");
      row.className = "sub-account-row";

      const card = document.createElement("a");
      card.className = "sub-account-card";
      card.href = acc.url;

      if (!acc.url.startsWith("tel:") && !acc.url.startsWith("mailto:")) {
        card.target = "_blank";
        card.rel = "noopener noreferrer";
      }

      const info = document.createElement("div");
      const strong = document.createElement("strong");
      strong.textContent = acc.name;

      const small = document.createElement("small");
      small.textContent = acc.handle;

      info.append(strong, small);

      const arr = document.createElement("span");
      arr.className = "sub-account-arrow";
      arr.textContent = "↗";

      card.append(info, arr);
      row.append(card);
      list.append(row);
    });

    $("multiModal").classList.add("show");
    $("closeMultiModal").focus();
  }

  function closeMultiModal() {
    $("multiModal").classList.remove("show");
    if (lastFocusedEl && typeof lastFocusedEl.focus === "function") {
      lastFocusedEl.focus();
      lastFocusedEl = null;
    }
  }

  function closeQrModal() {
    $("qrModal").classList.remove("show");
    if (lastFocusedEl && typeof lastFocusedEl.focus === "function") {
      lastFocusedEl.focus();
      lastFocusedEl = null;
    }
  }

  $("closeMultiModal").addEventListener("click", closeMultiModal);
  $("multiModal").addEventListener("click", e => { if (e.target === $("multiModal")) closeMultiModal(); });

  document.addEventListener("keydown", e => {
    if (e.key === "Escape") {
      if ($("aboutWarningModal").classList.contains("show")) closeAboutWarning(true);
      if ($("qrModal").classList.contains("show")) closeQrModal();
      if ($("multiModal").classList.contains("show")) closeMultiModal();
      closeMenus();
    }
  });

  document.querySelectorAll("[data-language]").forEach(btn => {
    btn.addEventListener("click", e => {
      e.stopPropagation();
      language = btn.dataset.language;
      try { localStorage.setItem("rihani-language", language); } catch(err) {}
      closeMenus();
      render();
      updateClock();
    });
  });

  document.querySelectorAll("[data-theme]").forEach(btn => {
    btn.addEventListener("click", e => {
      e.stopPropagation();
      theme = btn.dataset.theme;
      try { localStorage.setItem("rihani-theme", theme); } catch(err) {}
      closeMenus();
      render();
    });
  });

  function updateClock() {
    const now = new Date();
    const locale = language === "ar" ? "ar-DZ" : language === "fr" ? "fr-FR" : language === "es" ? "es-ES" : "en-GB";
    $("clockTime").textContent = new Intl.DateTimeFormat(locale, { hour:"2-digit", minute:"2-digit", second:"2-digit", hour12:false }).format(now);
    $("clockDate").textContent = new Intl.DateTimeFormat(locale, { weekday:"long", day:"numeric", month:"long", year:"numeric" }).format(now);
  }

  updateClock();
  setInterval(updateClock, 1000);

  $("shareBtn").addEventListener("click", async () => {
    const shareData = { title:"Zed's Infos | ZINEDDINE", text:profile.bio[language], url:window.location.href };
    try {
      if (navigator.share) {
        await navigator.share(shareData);
        return;
      }
    } catch(e) {
      if (e && e.name === "AbortError") return;
    }
    const ok = await copyText(window.location.href);
    if (ok) {
      const label = $("shareBtn").querySelector("[data-translate='share']");
      const prev = label.textContent;
      label.textContent = "✓";
      setTimeout(() => { label.textContent = prev; }, 1400);
    }
  });

  function createQR() {
    const website = window.location.href;
    const qrURL = "https://api.qrserver.com/v1/create-qr-code/?size=500x500&format=png&data=" + encodeURIComponent(website);
    $("qrImage").src = qrURL;
    $("qrAddress").textContent = website;
    return qrURL;
  }

  $("qrBtn").addEventListener("click", () => {
    lastFocusedEl = $("qrBtn");
    createQR();
    $("qrModal").classList.add("show");
    $("closeQR").focus();
  });

  $("closeQR").addEventListener("click", closeQrModal);
  $("qrModal").addEventListener("click", e => { if (e.target === $("qrModal")) closeQrModal(); });

  $("downloadQR").addEventListener("click", async () => {
    const url = createQR();
    try {
      const res = await fetch(url);
      const blob = await res.blob();
      const objURL = URL.createObjectURL(blob);
      const a = document.createElement("a");
      a.href = objURL;
      a.download = "Zeds-Infos-QR.png";
      document.body.appendChild(a);
      a.click();
      a.remove();
      URL.revokeObjectURL(objURL);
    } catch(e) { window.open(url, "_blank"); }
  });

  window.addEventListener("scroll", () => {
    $("topBtn").classList.toggle("visible", window.scrollY > 300);
  });

  $("topBtn").addEventListener("click", () => window.scrollTo({top:0, behavior:"smooth"}));

  render();
  const loaderFallback = setTimeout(() => $("loader").classList.add("hide"), 2000);
  window.addEventListener("load", () => {
    clearTimeout(loaderFallback);
    setTimeout(() => $("loader").classList.add("hide"), 650);
  });
  </script>
</body>
</html>
