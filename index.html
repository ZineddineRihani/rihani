<style>
:root{
 color-scheme:dark;
 --bg:#090805;--surface:rgba(25,22,15,.9);--card:rgba(30,26,17,.72);
 --text:#fff9e9;--muted:#b6a985;--border:rgba(233,189,88,.25);
 --accent:#e6b94f;--shadow:0 18px 55px #0006
}
body.light{
 color-scheme:light;--bg:#f6f0df;--surface:rgba(255,251,238,.96);
 --card:rgba(255,248,226,.9);--text:#261c0b;--muted:#82734f;
 --border:rgba(153,111,34,.25);--accent:#a8751d;--shadow:0 15px 40px #5a411a18
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{
 margin:0;min-height:100vh;font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;
 background:radial-gradient(ellipse at 10% 5%,#be8b232e,transparent 38%),
 radial-gradient(ellipse at 95% 45%,#daad4b1c,transparent 38%),var(--bg);
 color:var(--text);transition:background .3s,color .3s
}
button,input{font:inherit}button{color:inherit}a{color:inherit}
button:focus-visible,a:focus-visible,input:focus-visible{outline:3px solid #e6b94f88;outline-offset:3px}
#loader{
 position:fixed;inset:0;z-index:9999;display:flex;flex-direction:column;
 align-items:center;justify-content:center;gap:18px;background:#090805;color:white;
 transition:.4s
}
#loader.hide{opacity:0;visibility:hidden;pointer-events:none}
.loader-logo{
 font-size:30px;font-weight:950;letter-spacing:4px;
 background:linear-gradient(120deg,#fff0b5,#d6a642,#a8751d);
 background-clip:text;-webkit-background-clip:text;color:transparent
}
.loader-line{
 width:100px;height:3px;border-radius:10px;
 background:linear-gradient(90deg,#a8751d,#ffe6a6,#d6a642);
 animation:line 1s infinite alternate
}
@keyframes line{to{transform:scaleX(.3)}}
.container{width:min(100% - 28px,760px);margin:auto;padding:22px 0 30px}
nav{
 position:relative;z-index:20;display:flex;align-items:center;justify-content:space-between;
 gap:10px;padding:13px 15px;border:1px solid var(--border);border-radius:19px;
 background:var(--surface);backdrop-filter:blur(22px);box-shadow:var(--shadow)
}
.brand{font-size:15px;font-weight:950;letter-spacing:1.5px}
.brand:before{content:"♛ ";color:var(--accent)}
.controls{display:flex;gap:7px}
.dropdown{position:relative}
.control{
 border:1px solid var(--border);background:var(--card);color:var(--text);
 padding:9px 11px;border-radius:11px;cursor:pointer;font-size:11px;font-weight:800
}
.dropdown-menu{
 position:absolute;top:calc(100% + 9px);inset-inline-end:0;z-index:100;width:155px;
 padding:7px;border:1px solid var(--border);border-radius:15px;
 background:var(--surface);backdrop-filter:blur(25px);box-shadow:var(--shadow);display:none
}
.dropdown-menu.open{display:block}
.menu-option{
 display:flex;justify-content:space-between;width:100%;padding:10px;border:0;
 border-radius:9px;background:transparent;color:var(--text);cursor:pointer;
 text-align:start;font-size:12px
}
.menu-option:hover,.menu-option.active{background:#e6b94f1a;color:var(--accent)}
header{text-align:center;padding:43px 12px 25px}
.avatar{
 width:116px;height:116px;margin:0 auto 20px;padding:3px;border-radius:35px;
 background:linear-gradient(135deg,#fff0b5,#a8751d,#e6b94f);
 box-shadow:0 12px 40px #be8b2347
}
.avatar img{
 width:100%;height:100%;object-fit:cover;border-radius:32px;background:var(--surface)
}
.name-line{display:flex;justify-content:center;align-items:center;gap:9px;margin:0}
.name-line h1{margin:0;font-size:clamp(23px,5vw,30px);font-weight:950;letter-spacing:1.4px}
.verified-badge{width:25px;height:25px;display:inline-grid;place-items:center;filter:drop-shadow(0 2px 5px #1d9bf05a)}
.verified-badge svg{width:100%;height:100%}
.subtitle{color:var(--accent);font-size:13px;margin:12px 0;font-weight:750}
.bio{max-width:430px;margin:auto;color:var(--muted);line-height:1.8;font-size:14px}
.tags{display:flex;justify-content:center;flex-wrap:wrap;gap:9px;margin-top:20px}
.tag{padding:8px 13px;border:1px solid var(--border);border-radius:30px;background:var(--surface);font-size:10px;font-weight:800}
.tag:first-child{color:var(--accent)}
.clock-box{
 width:max-content;max-width:100%;margin:20px auto 0;padding:10px 17px;
 border:1px solid var(--border);border-radius:14px;background:var(--surface);text-align:center
}
.clock-time{font-size:18px;font-weight:900;font-variant-numeric:tabular-nums}
.clock-date{margin-top:3px;color:var(--muted);font-size:10px}
.actions{display:flex;justify-content:center;flex-wrap:wrap;gap:9px;margin:24px auto 8px}
.action-btn{
 display:flex;align-items:center;justify-content:center;gap:7px;padding:11px 15px;
 border:1px solid var(--border);border-radius:13px;color:var(--text);
 background:var(--surface);cursor:pointer;font-size:11px;font-weight:800;transition:.2s
}
.action-btn:hover{border-color:var(--accent);transform:translateY(-2px)}
.search-wrap{margin:0 0 17px}
.search-input{
 width:100%;padding:12px 15px;border:1px solid var(--border);border-radius:13px;
 background:var(--surface);color:var(--text);font-size:13px
}
.search-input::placeholder{color:var(--muted)}
section{margin-top:27px}
.section-title{
 display:flex;align-items:center;gap:12px;font-size:12px;font-weight:900;
 letter-spacing:1px;margin:0 2px 14px
}
.section-title:before{content:"♛";color:var(--accent);font-size:16px}
.section-title:after{content:"";height:1px;flex:1;background:var(--border)}
.links{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:11px}
.link-card{
 position:relative;min-width:0;min-height:83px;border:1px solid var(--border);
 border-radius:18px;background:linear-gradient(135deg,#ffffff0e,#be8b230e,#ffffff08),var(--card);
 backdrop-filter:blur(22px);box-shadow:inset 0 1px #ffffff12,0 12px 35px #0002;
 overflow:hidden;transition:.2s
}
.link-card:hover{transform:translateY(-3px);border-color:var(--accent);box-shadow:0 12px 30px #be8b232b}
.link-main{
 position:relative;display:flex;align-items:center;justify-content:center;width:100%;
 min-height:81px;padding:12px 38px;border:0;background:transparent;cursor:pointer;
 text-align:center;color:var(--text);text-decoration:none
}
.info{width:100%;min-width:0;text-align:center}
.info strong{display:block;font-size:12px;font-weight:900;overflow-wrap:anywhere}
.info small{display:block;margin-top:5px;color:var(--muted);font-size:10px;overflow-wrap:anywhere}
.icon{
 position:absolute;inset-inline-start:9px;top:50%;transform:translateY(-50%);
 width:34px;height:34px;display:grid;place-items:center;border-radius:11px;
 color:var(--brand);background:color-mix(in srgb,var(--brand) 15%,transparent);
 border:1px solid color-mix(in srgb,var(--brand) 35%,transparent);
 font-size:21px;font-weight:900
}
.icon svg{width:21px;height:21px;fill:currentColor}
.icon.instagram svg{fill:none;stroke:currentColor;stroke-width:2}
.arrow{position:absolute;inset-inline-end:10px;top:50%;transform:translateY(-50%);color:var(--accent)}
.copy-btn{
 position:absolute;bottom:6px;inset-inline-end:8px;z-index:3;border:1px solid var(--border);
 padding:4px 7px;border-radius:7px;color:var(--muted);background:var(--surface);
 cursor:pointer;font-size:9px;font-weight:800
}
.empty-state{padding:20px;text-align:center;color:var(--muted);font-size:13px;border:1px dashed var(--border);border-radius:14px}
.modal{
 position:fixed;inset:0;z-index:5000;display:none;align-items:center;justify-content:center;
 padding:20px;background:#000b;backdrop-filter:blur(9px)
}
.modal.show{display:flex}
.modal-box{
 width:min(100%,370px);max-height:90vh;overflow:auto;padding:25px;text-align:center;
 border:1px solid var(--border);border-radius:23px;background:var(--surface);box-shadow:0 25px 80px #0006
}
.modal-box h2{margin:0 0 8px;font-size:19px}
.modal-box p{color:var(--muted);font-size:12px;line-height:1.7}
.profile-options{display:grid;gap:10px;margin-top:18px}
.profile-option{
 display:flex;align-items:center;justify-content:space-between;gap:12px;width:100%;
 padding:14px 15px;border:1px solid var(--border);border-radius:14px;
 background:var(--card);color:var(--text);text-decoration:none;text-align:start;
 font-size:13px;font-weight:850;transition:.2s
}
.profile-option:hover{border-color:var(--accent);transform:translateY(-1px)}
.profile-option small{display:block;margin-top:4px;color:var(--muted);font-size:11px;font-weight:600}
.qr-image{width:205px;height:205px;max-width:100%;margin:15px auto;display:block;padding:9px;border-radius:14px;background:white;object-fit:contain}
.modal-buttons{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-top:15px}
#toast{
 position:fixed;bottom:25px;left:50%;z-index:7000;transform:translate(-50%,20px);
 opacity:0;pointer-events:none;max-width:calc(100vw - 30px);padding:12px 18px;
 border:1px solid var(--border);border-radius:13px;background:var(--surface);
 color:var(--text);box-shadow:var(--shadow);font-size:12px;font-weight:800;
 transition:.25s;text-align:center

#toast.show{opacity:1;transform:translate(-50%,0)}
#topBtn{
 position:fixed;bottom:22px;inset-inline-end:18px;z-index:1000;width:43px;height:43px;
 display:grid;place-items:center;border:1px solid var(--border);border-radius:14px;
 color:var(--text);background:var(--surface);cursor:pointer;opacity:0;visibility:hidden;transition:.25s
}
#topBtn.visible{opacity:1;visibility:visible}
footer{text-align:center;padding:43px 10px 15px;color:var(--muted);font-size:10px;line-height:2;letter-spacing:1px}
footer b{color:var(--accent)}
@media(max-width:450px){

 .action-btn{padding:10px 12px;font-size:10px}
}
@media(prefers-reduced-motion:reduce){

</head>

const $=id=>document.getElementById(id);
let language="en",theme="dark",toastTimer,previousFocus=null;

try{
 const savedLanguage=localStorage.getItem("rihani-language");
 const savedTheme=localStorage.getItem("rihani-theme");
 if(translations[savedLanguage])language=savedLanguage;
 if(["dark","light"].includes(savedTheme))theme=savedTheme;
}catch(error){}

function toast(message){
 $("toast").textContent=message;
 $("toast").classList.add("show");
 clearTimeout(toastTimer);
 toastTimer=setTimeout(()=>$("toast").classList.remove("show"),2400);
}

async function copyText(value){
 try{
  if(navigator.clipboard&&window.isSecureContext){
   await navigator.clipboard.writeText(value);
  }else{
   const field=document.createElement("textarea");
   field.value=value;
   field.setAttribute("readonly","");
   field.style.position="fixed";
   field.style.opacity="0";
   document.body.appendChild(field);
   field.select();
   const copied=document.execCommand("copy");
   field.remove();
   if(!copied)throw new Error("Copy failed");
  }
  toast(translations[language].copied);
 }catch(error){
  toast(translations[language].copyError);
 }
}

function itemName(item){
 return typeof item.name==="object"?item.name[language]:item.name;
}

function closeMenus(){
 ["lang","theme"].forEach(key=>{
  $(key+"Menu").classList.remove("open");
  $(key+"Btn").setAttribute("aria-expanded","false");
 });
}

function toggleMenu(key){
 const menu=$(key+"Menu"),button=$(key+"Btn");
 const opening=!menu.classList.contains("open");
 closeMenus();
 if(opening){
  menu.classList.add("open");
  button.setAttribute("aria-expanded","true");
 }
}

$("langBtn").addEventListener("click",()=>toggleMenu("lang"));
$("themeBtn").addEventListener("click",()=>toggleMenu("theme"));

document.addEventListener("click",event=>{
 if(!event.target.closest(".dropdown"))closeMenus();
});

document.addEventListener("keydown",event=>{
 if(event.key==="Escape"){
  closeMenus();
  closeProfiles();
  closeQR();
 }
});

function render(){
 const t=translations[language];

 document.documentElement.lang=language;
 document.documentElement.dir=language==="ar"?"rtl":"ltr";
 document.body.classList.toggle("light",theme==="light");

 $("subtitle").textContent=profile.subtitle[language];
 $("bio").textContent=profile.bio[language];
 $("langCurrent").textContent=t.language;
 $("themeCurrent").textContent=theme==="dark"?t.dark:t.light;
 $("themeBtn").innerHTML=(theme==="dark"?"🌙 ":"☀️ ")+"<span>"+t[theme]+"</span> ▾";
 $("footerTop").textContent=t.footer;
 $("qrTitle").textContent=t.qrTitle;
 $("qrDescription").textContent=t.qrDescription;
 $("downloadQR").textContent=t.download;
 $("closeQR").textContent=t.close;
 $("searchInput").placeholder=t.search;
 $("profileModalTitle").textContent=t.choose;
 $("profileModalDescription").textContent=t.chooseDesc;
 $("closeProfiles").textContent=t.close;

 document.querySelectorAll("[data-i18n]").forEach(element=>{
  const key=element.dataset.i18n;
  if(t[key])element.textContent=t[key];
 });

 $("tags").replaceChildren(...profile.tags[language].map(label=>{
  const tag=document.createElement("span");
  tag.className="tag";
  tag.textContent=label;
  return tag;
 }));

 document.querySelectorAll("[data-language]").forEach(button=>{
  button.classList.toggle("active",button.dataset.language===language);
 });
 document.querySelectorAll("[data-theme]").forEach(button=>{
  button.classList.toggle("active",button.dataset.theme===theme);
 });

 renderSections($("searchInput").value);
}

function renderSections(query=""){
 const root=$("sections");
 const q=query.trim().toLocaleLowerCase();
 root.replaceChildren();
 let count=0;

 profile.sections.forEach(section=>{
  const title=section.title[language];

  const items=section.links.filter(item=>{
   const accounts=(item.accounts||[])
    .map(account=>[account.label,account.handle,account.url].join(" "))
    .join(" ");

   const searchable=[
    itemName(item),item.handle||"",item.url||"",accounts,title
   ].join(" ").toLocaleLowerCase();

   return searchable.includes(q);
  });

  if(!items.length)return;
  count+=items.length;

  const sectionElement=document.createElement("section");
  const heading=document.createElement("h2");
  heading.className="section-title";
  heading.textContent=title;

  const grid=document.createElement("div");
  grid.className="links";

  items.forEach(item=>{
   const card=document.createElement("article");
   card.className="link-card";
   card.style.setProperty("--brand",item.color||"#D6A642");

   const main=document.createElement(item.accounts?"button":"a");
   main.className="link-main";

   if(item.accounts){
    main.type="button";
    main.setAttribute("aria-haspopup","dialog");
    main.setAttribute("aria-label",itemName(item)+" — "+translations[language].choose);
    main.addEventListener("click",()=>openProfiles(item));
   }else{
    main.href=item.url;
    if(!item.url.startsWith("tel:")&&!item.url.startsWith("mailto:")){
     main.target="_blank";
     main.rel="noopener noreferrer";
    }
   }

   const icon=document.createElement("span");
   icon.className="icon "+item.icon;
   icon.innerHTML=icons[item.icon]||icons.more;

   let iconColor=item.color||"#D6A642";
   if(item.icon==="x")iconColor=theme==="dark"?"#fff":"#111";
   icon.style.setProperty("--brand",iconColor);

   const info=document.createElement("span");
   info.className="info";

   const strong=document.createElement("strong");
   strong.textContent=itemName(item);

   const small=document.createElement("small");
   small.textContent=item.handle||"";

   info.append(strong,small);

   const arrow=document.createElement("span");
   arrow.className="arrow";
   arrow.textContent="↗";

   main.append(icon,info,arrow);

   const copy=document.createElement("button");
   copy.className="copy-btn";
   copy.type="button";
   copy.textContent=translations[language].copy+" ⧉";
   copy.setAttribute("aria-label",translations[language].copy+" "+itemName(item));

   copy.addEventListener("click",event=>{
    event.stopPropagation();
    const content=item.accounts
     ?itemName(item)+"\n"+item.accounts.map(account=>account.handle+"\n"+account.url).join("\n\n")
     :itemName(item)+"\n"+(item.handle||"")+"\n"+(item.url||"");
    copyText(content);
   });

   card.append(main,copy);
   grid.append(card);
  });

  sectionElement.append(heading,grid);
  root.append(sectionElement);
 });

 if(!count){
  const empty=document.createElement("div");
  empty.className="empty-state";
  empty.textContent=translations[language].noResults;
  root.append(empty);
 }
}

document.querySelectorAll("[data-language]").forEach(button=>{
 button.addEventListener("click",()=>{
  language=button.dataset.language;
  try{localStorage.setItem("rihani-language",language)}catch(error){}
  closeMenus();
  render();
  updateClock();
 });
});

document.querySelectorAll("[data-theme]").forEach(button=>{
 button.addEventListener("click",()=>{
  theme=button.dataset.theme;
  try{localStorage.setItem("rihani-theme",theme)}catch(error){}
  closeMenus();
  render();
 });
});

$("searchInput").addEventListener("input",event=>renderSections(event.target.value));

function openProfiles(item){
 const root=$("profileOptions");
 const t=translations[language];
 root.replaceChildren();

 previousFocus=document.activeElement;
 $("profileModalTitle").textContent=itemName(item);
 $("profileModalDescription").textContent=t.chooseDesc;

 item.accounts.forEach((account,index)=>{
  const link=document.createElement("a");
  link.className="profile-option";
  link.href=account.url;

  if(!account.url.startsWith("tel:")){
   link.target="_blank";
   link.rel="noopener noreferrer";
  }

  const label=document.createElement("span");
  const labelName=language==="ar"
   ?(account.url.startsWith("tel:")?t.number+" "+(index+1):t.account+" "+(index+1))
   :account.label;

  label.textContent=labelName;

  const small=document.createElement("small");
  small.textContent=account.handle;
  label.append(small);

  const arrow=document.createElement("span");
  arrow.textContent=account.url.startsWith("tel:")?"☎":"↗";

  link.append(label,arrow);
  root.append(link);
 });

 $("profileModal").classList.add("show");
 $("closeProfiles").focus();
}

function closeProfiles(){
 const modal=$("profileModal");
 if(!modal.classList.contains("show"))return;
 modal.classList.remove("show");
 if(previousFocus&&typeof previousFocus.focus==="function")previousFocus.focus();
}

$("closeProfiles").addEventListener("click",closeProfiles);
$("profileModal").addEventListener("click",event=>{
 if(event.target===$("profileModal"))closeProfiles();
});

function updateClock(){
 const now=new Date();
 const locale=language==="ar"?"ar-DZ":language==="fr"?"fr-FR":language==="es"?"es-ES":"en-GB";

 $("clockTime").textContent=new Intl.DateTimeFormat(locale,{
  hour:"2-digit",minute:"2-digit",second:"2-digit",hour12:false
 }).format(now);

 $("clockDate").textContent=new Intl.DateTimeFormat(locale,{
  weekday:"long",day:"numeric",month:"long",year:"numeric"
 }).format(now);
}

updateClock();
setInterval(updateClock,1000);
$("year").textContent=new Date().getFullYear();

$("shareBtn").addEventListener("click",async()=>{
 const data={
  title:"Zed's Infos | ZINEDDINE",
  text:profile.bio[language],
  url:location.href
 };

 try{
  if(navigator.share){
   await navigator.share(data);
  }else{
   await copyText(location.href);
  }
 }catch(error){
  if(error.name!=="AbortError")await copyText(location.href);
 }
});

function qrUrl(){
 const url=new URL("https://api.qrserver.com/v1/create-qr-code/");
 url.searchParams.set("size","500x500");
 url.searchParams.set("data",location.href);
 return url.toString();
}

function openQR(){
 previousFocus=document.activeElement;
 $("qrStatus").textContent=translations[language].qrLoading;
 $("qrImage").removeAttribute("src");
 $("qrImage").src=qrUrl();
 $("qrAddress").textContent=location.href;
 $("qrModal").classList.add("show");
 $("closeQR").focus();
}

function closeQR(){
 const modal=$("qrModal");
 if(!modal.classList.contains("show"))return;
 modal.classList.remove("show");
 if(previousFocus&&typeof previousFocus.focus==="function")previousFocus.focus();
}

$("qrBtn").addEventListener("click",openQR);
$("closeQR").addEventListener("click",closeQR);

$("qrModal").addEventListener("click",event=>{
 if(event.target===$("qrModal"))closeQR();
});

$("qrImage").addEventListener("load",()=>{
 $("qrStatus").textContent="";
});

$("qrImage").addEventListener("error",()=>{
 $("qrStatus").textContent=translations[language].qrError;
});

$("downloadQR").addEventListener("click",async()=>{
 const url=qrUrl();
 $("qrStatus").textContent=translations[language].qrLoading;

 try{
  const response=await fetch(url);
  if(!response.ok)throw new Error("QR download failed");

  const blob=await response.blob();
  const objectUrl=URL.createObjectURL(blob);
  const link=document.createElement("a");

  link.href=objectUrl;
  link.download="Zeds-Infos-QR.png";
  document.body.appendChild(link);
  link.click();
  link.remove();

  setTimeout(()=>URL.revokeObjectURL(objectUrl),10000);
  $("qrStatus").textContent="";
 }catch(error){
  $("qrStatus").textContent=translations[language].qrDownloadError;
  window.open(url,"_blank","noopener,noreferrer");
 }
});

$("copyAllBtn").addEventListener("click",()=>{
 const all=profile.sections.map(section=>
  section.title[language]+"\n"+
  section.links.map(item=>{
   if(item.accounts){
    return itemName(item)+"\n"+
     item.accounts.map(account=>account.handle+"\n"+account.url).join("\n\n");
   }
   return itemName(item)+"\n"+(item.handle||"")+"\n"+(item.url||"");
  }).join("\n\n")
 ).join("\n\n--------------------\n\n");

 copyText("Zed's Infos — ZINEDDINE\n\n"+all);
});

window.addEventListener("scroll",()=>{
 $("topBtn").classList.toggle("visible",window.scrollY>300);
},{passive:true});

$("topBtn").addEventListener("click",()=>{
 window.scrollTo({top:0,behavior:"smooth"});
});

$("profileImage").addEventListener("error",function(){
 this.onerror=null;
 this.src="data:image/svg+xml,"+encodeURIComponent(
  '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200"><rect width="200" height="200" fill="#211b0d"/><text x="50%" y="54%" dominant-baseline="middle" text-anchor="middle" fill="#e6b94f" font-family="Arial" font-size="58" font-weight="bold">ZR</text></svg>'
 );
});

render();

let loaderHidden=false;
function hideLoader(){
 if(loaderHidden)return;
 loaderHidden=true;
 $("loader").classList.add("hide");
}

window.addEventListener("load",()=>setTimeout(hideLoader,180));
setTimeout(hideLoader,1800);
</script>
