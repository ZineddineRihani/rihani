
<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#08080d">
<meta name="description" content="RIHANI — Personal Social Hub">
<title>RIHANI — Social Hub</title>

<style>
:root {
  --bg:#08080d;
  --surface:#11111b;
  --card:#151522;
  --border:rgba(255,255,255,.09);
  --text:#f7f5ff;
  --muted:#9693a9;
  --accent:#a78bfa;
  --accent2:#60a5fa;
  --shadow:0 15px 45px rgba(0,0,0,.22);
}

body.light {
  --bg:#f4f3fa;
  --surface:#ffffff;
  --card:#ffffff;
  --border:rgba(30,25,60,.10);
  --text:#171525;
  --muted:#77738b;
  --accent:#7952d8;
  --accent2:#347bdc;
  --shadow:0 12px 35px rgba(40,30,90,.08);
}

* {box-sizing:border-box}

body {
  margin:0;
  min-height:100vh;
  font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;
  background:
    radial-gradient(ellipse at 10% 0%,rgba(124,58,237,.16),transparent 38%),
    radial-gradient(ellipse at 95% 40%,rgba(37,99,235,.12),transparent 35%),
    var(--bg);
  color:var(--text);
  transition:background .3s,color .3s;
}

button {font:inherit}

.container {
  width:min(100% - 32px,760px);
  margin:auto;
  padding:24px 0 30px;
}

/* NAVIGATION */

nav {
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:12px;
  padding:13px 16px;
  background:var(--surface);
  border:1px solid var(--border);
  border-radius:18px;
  box-shadow:var(--shadow);
}

.brand {
  font-size:16px;
  font-weight:900;
  letter-spacing:3px;
}

.controls {
  display:flex;
  gap:8px;
}

.control {
  border:1px solid var(--border);
  background:var(--card);
  color:var(--text);
  padding:9px 13px;
  border-radius:11px;
  cursor:pointer;
  font-size:12px;
  font-weight:750;
  transition:.2s;
}

.control:hover {
  border-color:var(--accent);
  transform:translateY(-2px);
}

/* PROFILE */

header {
  text-align:center;
  padding:55px 12px 35px;
}

.avatar {
  width:116px;
  height:116px;
  margin:0 auto 23px;
  padding:3px;
  border-radius:35px;
  background:linear-gradient(135deg,var(--accent),var(--accent2));
  box-shadow:0 12px 40px rgba(124,58,237,.25);
}

.avatar img {
  width:100%;
  height:100%;
  object-fit:cover;
  border-radius:32px;
  background:var(--surface);
}

h1 {
  margin:0;
  font-size:clamp(30px,7vw,43px);
  font-weight:900;
  letter-spacing:1px;
}

.subtitle {
  color:var(--accent);
  font-size:13px;
  margin:12px 0;
  font-weight:700;
}

.bio {
  max-width:430px;
  margin:0 auto;
  color:var(--muted);
  line-height:1.8;
  font-size:14px;
}

.tags {
  display:flex;
  justify-content:center;
  flex-wrap:wrap;
  gap:9px;
  margin-top:22px;
}

.tag {
  padding:8px 13px;
  border:1px solid var(--border);
  border-radius:30px;
  background:var(--surface);
  font-size:11px;
  font-weight:700;
}

/* SECTIONS */

section {margin-top:27px}

.section-title {
  display:flex;
  align-items:center;
  gap:12px;
  font-size:12px;
  font-weight:850;
  letter-spacing:1px;
  margin:0 2px 15px;
}

.section-title:after {
  content:"";
  height:1px;
  flex:1;
  background:var(--border);
}

.links {
  display:grid;
  grid-template-columns:repeat(2,minmax(0,1fr));
  gap:12px;
}

.link {
  display:flex;
  align-items:center;
  gap:13px;
  min-width:0;
  min-height:76px;
  padding:13px;
  text-decoration:none;
  color:var(--text);
  background:var(--card);
  border:1px solid var(--border);
  border-radius:18px;
  box-shadow:var(--shadow);
  transition:transform .22s,border-color .22s;
}

.link:hover {
  transform:translateY(-4px);
  border-color:var(--accent);
}

.link:active {
  transform:scale(.97);
}

.icon {
  width:43px;
  height:43px;
  flex:0 0 43px;
  display:grid;
  place-items:center;
  border-radius:14px;
  background:linear-gradient(135deg,rgba(167,139,250,.2),rgba(96,165,250,.14));
  color:var(--accent);
  font-size:19px;
  font-weight:900;
}

.info {
  min-width:0;
  flex:1;
}

.info strong {
  display:block;
  font-size:13px;
  overflow-wrap:anywhere;
}

.info small {
  display:block;
  color:var(--muted);
  margin-top:5px;
  font-size:10px;
  overflow-wrap:anywhere;
}

.arrow {
  color:var(--muted);
  font-size:17px;
  margin-inline-start:auto;
}

/* FOOTER */

footer {
  text-align:center;
  padding:48px 10px 15px;
  color:var(--muted);
  font-size:10px;
  line-height:2;
  letter-spacing:1px;
}

footer b {color:var(--accent)}

[dir="rtl"] .section-title {
  letter-spacing:0;
}

@media(max-width:450px) {
  .container {width:calc(100% - 24px)}
  .links {grid-template-columns:1fr}
  header {padding-top:42px}
  .link {min-height:72px}
}

@media(prefers-reduced-motion:reduce) {
  *,*::before,*::after {
    transition:none !important;
    animation:none !important;
  }
}
</style>
</head>

<body>
<div class="container">

<nav>
  <div class="brand">RIHANI ✦</div>

  <div class="controls">
    <button class="control" id="langBtn" type="button">AR العربية</button>
    <button class="control" id="themeBtn" type="button">☀️ Light</button>
  </div>
</nav>

<header>
  <div class="avatar">
    <img
      id="avatar"
      src="https://raw.githubusercontent.com/ZineddineRihani/rihani/main/profile.png"
      alt="RIHANI Profile"
    >
  </div>

  <h1 id="name">Mr ZINEDDINE ✪</h1>
  <p class="subtitle" id="subtitle"></p>
  <p class="bio" id="bio"></p>
  <div class="tags" id="tags"></div>
</header>

<main id="sections"></main>

<footer>
  <div id="footerTop">BUILT WITH PRECISION</div>
  <b>ZINEDDINE RIHANI ✪</b>
  <div>© 2026 · ALL RIGHTS RESERVED</div>
</footer>

</div>

<script>

/* =========================
   RIHANI PROFILE SETTINGS
========================= */

const profile = {

  name: "Mr ZINEDDINE ✪",

  subtitle: {

    ar: "صُنع بإتقان · منصتي الشخصية 🤍"
  },

  bio: {
    en: "All my profiles and ways to connect... 🔋",
    ar: "جميع حساباتي وطرق التواصل معي... 🔋"
  },

  tags: {
    en: ["MR RIHANI 👑", "PERSONAL ✖️", "SOCIAL 🌍"],
    ar: ["السيد ريحاني 👑", "شخصي ✖️", "تواصل 🌍"]
  },

  sections: [

    {
      title: {
        en: "SOCIAL NETWORKS",
        ar: "مواقع التواصل الاجتماعي"
      },

      links: [
        {
          name: "Instagram",
          handle: "@vexoneer ✪",
          url: "https://www.instagram.com/vexoneer?vrfl=MWlyZWpnM3Q4bzIxZw==",
          icon: "◉"
        },
        {
          name: "Snapchat",
          handle: "@zedeihani ✪",
          url: "https://www.snapchat.com/add/zedrihani?share_id=jjd9jiV2LWM&locale=en-DZ",
          icon: "Ⓢ"
        },
        {
          name: "Facebook",
          handle: "ZINEDDINE RIHANI",
          url: "https://www.facebook.com/share/19LDDoVm5W/",
          icon: "ⓕ"
        },
        {
          name: "X - Twitter",
          handle: "@ZedRihani ✪",
          url: "https://x.com/ZedRihani",
          icon: "𝕏"
        }
      ]
    },

    {
      title: {
        en: "TELEGRAM",
        ar: "تلغرام"
      },

      links: [
        {
          name: "Telegram - 01",
          handle: "@mr_rihani ✪",
          url: "https://t.me/mr_rihani",
          icon: "➤"
        },
        {
          name: "Telegram - 02",
          handle: "@rihani_05 ✪",
          url: "https://t.me/rihani_05",
          icon: "➤"
        },
        {
          name: "Telegram - 03",
          handle: "@zedrihani ✪",
          url: "https://t.me/zedrihani",
          icon: "➤"
        }
      ]
    },

    {
      title: {
        en: "WHATSAPP",
        ar: "واتساب"
      },

      links: [
        {
          name: "WhatsApp - 01",
          handle: "+213 795 92 36 99",
          url: "https://wa.me/qr/THNKCYVUOYRRN1",
          icon: "✆"
        },
        {
          name: "WhatsApp - 02",
          handle: "+213 780 55 11 14",
          url: "https://wa.me/qr/6ZHLW36EG325M1",
          icon: "✆"
        },
        {
          name: "WhatsApp - 03",
          handle: "+213 664 90 81 92",
          url: "https://wa.me/qr/M6FF2IZ6UDFGM1",
          icon: "✆"
        }
      ]
    },

    {
      title: {
        en: "MORE",
        ar: "المزيد"
      },

      links: [
        {
          name: {
            en: "Alternative Link",
            ar: "رابط بديل"
          },
          handle: "solo.to/rihani",
          url: "http://solo.to/rihani",
          icon: "⌘"
        }
      ]
    }

  ]
};


/* =========================
   LANGUAGE & THEME
========================= */

const $ = id => document.getElementById(id);

let language = localStorage.getItem("rihani-language") || "en";
let theme = localStorage.getItem("rihani-theme") || "dark";


/* =========================
   RENDER WEBSITE
========================= */

function render() {

  const ar = language === "ar";

  document.documentElement.lang = language;
  document.documentElement.dir = ar ? "rtl" : "ltr";

  document.body.classList.toggle(
    "light",
    theme === "light"
  );

  document.title = profile.name + " — Social Hub";

  $("name").textContent = profile.name;
  $("subtitle").textContent = profile.subtitle[language];
  $("bio").textContent = profile.bio[language];

  $("langBtn").textContent = ar
    ? "EN English"
    : "AR العربية";

  $("themeBtn").textContent = theme === "dark"
    ? "☀️ Light"
    : "🌙 Dark";

  $("footerTop").textContent = ar
    ? "صُنع بإتقان"
    : "BUILT WITH PRECISION";


  /* TAGS */

  $("tags").replaceChildren(
    ...profile.tags[language].map(tag => {

      const el = document.createElement("span");

      el.className = "tag";
      el.textContent = tag;

      return el;

    })
  );


  /* SECTIONS */

  const root = $("sections");

  root.replaceChildren();

  profile.sections.forEach(section => {

    const el = document.createElement("section");

    const heading = document.createElement("h2");

    heading.className = "section-title";
    heading.textContent = section.title[language];

    const grid = document.createElement("div");

    grid.className = "links";


    section.links.forEach(item => {

      const a = document.createElement("a");

      a.className = "link";
      a.href = item.url;
      a.target = "_blank";
      a.rel = "noopener noreferrer";

      const icon = document.createElement("span");

      icon.className = "icon";
      icon.textContent = item.icon;

      const info = document.createElement("span");

      info.className = "info";

      const strong = document.createElement("strong");

      strong.textContent =
        typeof item.name === "object"
          ? item.name[language]
          : item.name;

      const small = document.createElement("small");

      small.textContent = item.handle;

      info.append(strong, small);

      const arrow = document.createElement("span");

      arrow.className = "arrow";
      arrow.textContent = "↗";

      a.append(icon, info, arrow);

      grid.append(a);

    });

    el.append(heading, grid);

    root.append(el);

  });

}


/* =========================
   LANGUAGE SWITCH
========================= */

$("langBtn").addEventListener("click", () => {

  language = language === "en" ? "ar" : "en";

  localStorage.setItem("rihani-language", language);

  render();

});


/* =========================
   DARK / LIGHT MODE
========================= */

$("themeBtn").addEventListener("click", () => {

  theme = theme === "dark" ? "light" : "dark";

  localStorage.setItem("rihani-theme", theme);

  render();

});


/* =========================
   START
========================= */

render();

</script>

</body>
</html>
